services:
  - type: web
    name: aria-brain
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: worker
    name: aria-brain-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m aria_agent.worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
