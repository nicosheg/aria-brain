<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARIA — Personal Intelligence System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #050816;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Deep cosmic background */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, #0B1120 0%, #050816 100%);
      z-index: 0;
    }

    /* Milky way galaxy cloud (top-left to bottom-right) */
    .milky-way {
      position: fixed;
      top: -15%;
      left: -15%;
      width: 140%;
      height: 140%;
      background: linear-gradient(125deg,
        rgba(60, 80, 140, 0.15) 0%,
        rgba(90, 70, 160, 0.1) 30%,
        rgba(30, 40, 80, 0.05) 60%,
        transparent 85%);
      transform: rotate(28deg);
      pointer-events: none;
      z-index: 0;
      filter: blur(50px);
    }

    /* Starfield – many faint stars */
    .starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0% { opacity: 0; transform: scale(0.6); }
      50% { opacity: 0.9; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.6); }
    }

    /* Nebula dust top‑left corner */
    .nebula-dust {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(110, 90, 180, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(70px);
    }

    /* Main container – responsive, centered */
    .app-container {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 24px 24px;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    /* Header – only name badge, no icons */
    .header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 28px;
    }
    .user-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 0.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #E2E8F0;
      backdrop-filter: blur(6px);
    }

    /* Welcome banner – dynamic user name */
    .welcome-card {
      background: rgba(17, 24, 39, 0.55);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
      border: 0.5px solid rgba(255, 255, 255, 0.05);
    }
    .welcome-icon {
      width: 44px;
      height: 44px;
      background: rgba(96, 165, 250, 0.1);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .welcome-icon svg {
      width: 22px;
      height: 22px;
      stroke: #60A5FA;
      fill: none;
      stroke-width: 1.5;
    }
    .welcome-text {
      flex: 1;
    }
    .welcome-greeting {
      font-size: 16px;
      font-weight: 500;
      color: white;
      line-height: 1.4;
    }
    .welcome-greeting span {
      font-weight: 600;
      color: #A78BFA;
    }
    .timestamp {
      font-size: 11px;
      color: #6A7A9A;
      margin-left: 8px;
      margin-bottom: 20px;
    }

    /* Compact 3‑card grid (Memory, Education, Income) */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0 20px;
    }
    .feature-card {
      background: rgba(18, 25, 45, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 14px 10px 10px;
      display: flex;
      flex-direction: column;
      transition: all 0.2s;
      border: 0.5px solid rgba(255, 255, 255, 0.05);
    }
    /* Subtle glows (reduced) */
    .card-memory { box-shadow: 0 0 6px rgba(167, 139, 250, 0.12); }
    .card-education { box-shadow: 0 0 6px rgba(96, 165, 250, 0.12); }
    .card-income { box-shadow: 0 0 6px rgba(16, 185, 129, 0.12); }

    .card-icon {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .card-memory .card-icon { background: rgba(167, 139, 250, 0.12); }
    .card-education .card-icon { background: rgba(96, 165, 250, 0.12); }
    .card-income .card-icon { background: rgba(16, 185, 129, 0.12); }

    .card-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke-width: 1.5;
    }
    .card-memory .card-icon svg { stroke: #A78BFA; }
    .card-education .card-icon svg { stroke: #60A5FA; }
    .card-income .card-icon svg { stroke: #10B981; }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: white;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: 9px;
      color: #9CA3AF;
      line-height: 1.3;
      margin-bottom: 12px;
    }
    .card-arrow {
      align-self: flex-end;
      margin-top: auto;
      opacity: 0.5;
    }
    .card-arrow svg {
      width: 10px;
      height: 10px;
      stroke: #9CA3AF;
    }

    /* Input bar – perfect */
    .input-capsule {
      background: #0A0F1A;
      border: 1.2px solid #3B82F6;
      border-radius: 50px;
      padding: 8px 14px 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 10px 0 24px;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.15);
    }
    .input-icon-left svg {
      width: 18px;
      height: 18px;
      stroke: #60A5FA;
    }
    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      padding: 8px 0;
    }
    .input-field::placeholder {
      color: #334155;
      font-weight: 400;
    }
    .send-circle {
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid #1E40AF;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .send-circle svg {
      width: 16px;
      height: 16px;
      stroke: #3B82F6;
      stroke-width: 2;
    }

    /* Footer – personal credit */
    .footer-note {
      text-align: center;
      padding: 16px 0 8px;
      font-size: 10px;
      letter-spacing: 0.5px;
      color: #4A5A7A;
      border-top: 0.5px solid rgba(255, 255, 255, 0.05);
      margin-top: auto;
    }

    /* Chat overlay (clean, minimal) */
    .chat-view {
      position: fixed;
      inset: 0;
      background: #050816;
      z-index: 100;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    .chat-view.active {
      display: flex;
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }
    .message {
      max-width: 80%;
    }
    .message.user {
      align-self: flex-end;
    }
    .message.aria {
      align-self: flex-start;
    }
    .message-bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }
    .message.user .message-bubble {
      background: rgba(96, 165, 250, 0.2);
    }
  </style>
</head>
<body>

<div class="cosmic-bg"></div>
<div class="milky-way"></div>
<div class="nebula-dust"></div>
<div class="starfield" id="starfield"></div>

<div class="app-container" id="mainUI">
  <!-- Header: only user name badge -->
  <div class="header">
    <div class="user-badge" id="userBadge">—</div>
  </div>

  <!-- Welcome banner (dynamic name) -->
  <div class="welcome-card">
    <div class="welcome-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <div class="welcome-text">
      <div class="welcome-greeting">Hey <span id="userNameDisplay">friend</span>, welcome back.</div>
    </div>
  </div>
  <div class="timestamp" id="timestamp">—</div>

  <!-- 3 compact cards (Memory, Education, Income) -->
  <div class="cards-grid">
    <div class="feature-card card-memory" data-pillar="Memory">
      <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 1 0 0 18A9 9 0 0 0 12 2z"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></div>
      <div class="card-title">Memory</div>
      <div class="card-desc">Your memories, organized.</div>
      <div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
    <div class="feature-card card-education" data-pillar="Education">
      <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
      <div class="card-title">Education</div>
      <div class="card-desc">Learn, grow, and master.</div>
      <div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
    <div class="feature-card card-income" data-pillar="Income">
      <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div class="card-title">Income</div>
      <div class="card-desc">Track, plan, and grow.</div>
      <div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
  </div>

  <!-- Input bar -->
  <div class="input-capsule">
    <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <input type="text" class="input-field" id="mainInput" placeholder="Chat Aria...">
    <div class="send-circle" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>

  <!-- Footer -->
  <div class="footer-note">By MrNicosh Eg</div>
</div>

<!-- Chat overlay -->
<div id="chatView" class="chat-view">
  <div class="chat-header">
    <button class="back-btn" id="closeChatBtn">←</button>
    <div style="font-weight:500;">ARIA</div>
  </div>
  <div class="messages-area" id="messagesArea"></div>
  <div class="input-capsule" style="margin-bottom: 0;">
    <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <input type="text" class="input-field" id="chatInput" placeholder="Chat Aria...">
    <div class="send-circle" id="chatSendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>
</div>

<script>
  // Firebase config (unchanged, works with your backend)
  const firebaseConfig = {
    apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
    authDomain: "fiducia-148b9.firebaseapp.com",
    projectId: "fiducia-148b9",
    storageBucket: "fiducia-148b9.firebasestorage.app",
    messagingSenderId: "380888909038",
    appId: "1:380888909038:web:efe40c252537e670959fff"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let currentUser = null;

  // Update timestamp (Lagos time)
  function updateTimestamp() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Lagos' });
    const el = document.getElementById('timestamp');
    if (el) el.textContent = timeStr;
  }
  updateTimestamp();
  setInterval(updateTimestamp, 60000);

  // Starfield generator (faint, scattered)
  const starfield = document.getElementById('starfield');
  for (let i = 0; i < 280; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.width = (Math.random() * 2 + 0.4) + 'px';
    star.style.height = star.style.width;
    star.style.animationDuration = (Math.random() * 5 + 2) + 's';
    star.style.animationDelay = (Math.random() * 6) + 's';
    starfield.appendChild(star);
  }

  // UI elements
  const mainUI = document.getElementById('mainUI');
  const chatView = document.getElementById('chatView');
  const mainInput = document.getElementById('mainInput');
  const chatInput = document.getElementById('chatInput');
  const messagesArea = document.getElementById('messagesArea');
  const userNameSpan = document.getElementById('userNameDisplay');
  const userBadge = document.getElementById('userBadge');

  // Open chat when focusing the main input or clicking a card
  function openChat() {
    mainUI.style.display = 'none';
    chatView.classList.add('active');
    if (messagesArea.children.length === 0 && currentUser) {
      addMessage(`Hey ${currentUser.displayName?.split(' ')[0] || 'friend'}. I'm ARIA. Your memory is intact. What would you like to explore?`, 'aria');
    }
    chatInput.focus();
  }

  function closeChat() {
    mainUI.style.display = 'flex';
    chatView.classList.remove('active');
    messagesArea.innerHTML = '';
  }

  // Add message to chat
  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    div.innerHTML = `<div class="message-bubble">${text.replace(/\n/g, '<br>')}</div>`;
    messagesArea.appendChild(div);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  // Send message to backend
  async function sendToAria(message, inputElement) {
    if (!currentUser) return;
    addMessage(message, 'user');
    inputElement.value = '';
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: message,
          user_id: currentUser.uid,
          email: currentUser.email.toLowerCase()
        })
      });
      const data = await res.json();
      if (data.error) addMessage(`Error: ${data.error}`, 'aria');
      else addMessage(data.reply || '...', 'aria');
    } catch(e) {
      addMessage('Connection uncertain. Please try again.', 'aria');
    }
  }

  function sendFromChat() {
    const msg = chatInput.value.trim();
    if (!msg) return;
    sendToAria(msg, chatInput);
  }

  // Event listeners
  mainInput.addEventListener('focus', openChat);
  document.querySelectorAll('.feature-card').forEach(card => {
    card.addEventListener('click', () => {
      openChat();
      addMessage(`Let's talk about ${card.querySelector('.card-title').textContent}. How can I help?`, 'aria');
    });
  });
  document.getElementById('closeChatBtn').addEventListener('click', closeChat);
  document.getElementById('chatSendBtn').addEventListener('click', sendFromChat);
  chatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendFromChat();
    }
  });

  // Firebase auth
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      const displayName = user.displayName || user.email.split('@')[0];
      userNameSpan.textContent = displayName;
      userBadge.textContent = displayName;
      // Register the user with backend
      try {
        await fetch('/set_user_name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: user.uid,
            email: user.email.toLowerCase(),
            name: displayName
          })
        });
      } catch(e) { console.warn(e); }
    } else {
      window.location.href = '/login.html';
    }
  });

  // Auto-resize for mobile, ensure chat input is clean
  window.addEventListener('resize', () => {
    if (window.innerWidth > 600) {
      document.querySelector('.app-container').style.maxWidth = '560px';
    } else {
      document.querySelector('.app-container').style.maxWidth = '100%';
    }
  });
  window.dispatchEvent(new Event('resize'));
</script>
</body>
</html>
