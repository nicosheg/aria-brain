<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA 3.5</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:linear-gradient(160deg,#070a1e,#0b0f28);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;justify-content:center;align-items:center}
        #app{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;background:rgba(7,9,26,0.9);backdrop-filter:blur(10px);border-radius:32px;overflow:hidden;box-shadow:0 0 30px rgba(0,217,255,0.2)}
        .hdr{padding:16px;text-align:center;border-bottom:1px solid #00d9ff}
        .hdr h1{color:#fff;font-size:28px}
        .hdr h1 span{color:#00d9ff}
        .user-info{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;color:#ccc;font-size:14px}
        .user-info img{width:32px;height:32px;border-radius:50%}
        .logout-btn{background:transparent;border:1px solid #00d9ff;color:#00d9ff;padding:4px 12px;border-radius:20px;cursor:pointer}
        .chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
        .msg-row{display:flex;flex-direction:column}
        .msg-row.user{align-items:flex-end}
        .msg-row.aria{align-items:flex-start}
        .bubble{max-width:80%;padding:12px 16px;border-radius:24px;font-size:15px;line-height:1.4}
        .msg-row.user .bubble{background:#00d9ff;color:#000;border-radius:24px 24px 4px 24px}
        .msg-row.aria .bubble{background:#1e2a3a;color:#fff;border-radius:24px 24px 24px 4px}
        .ts{font-size:10px;color:#aaa;margin-top:4px}
        .inp-outer{padding:12px;border-top:1px solid #00d9ff}
        .inp-pill{display:flex;gap:8px;background:#1e2a3a;border-radius:40px;padding:8px 16px}
        textarea{flex:1;background:transparent;border:none;color:#fff;font-size:15px;resize:none;outline:none}
        .send{background:#00d9ff;color:#000;border:none;border-radius:40px;padding:8px 20px;cursor:pointer;font-weight:bold}
        .ftr{text-align:center;padding:8px;font-size:12px;color:#00d9ff;cursor:pointer}
        .login-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,#070a1e,#0b0f28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:1000}
        .login-btn{background:#00d9ff;color:#000;border:none;border-radius:40px;padding:12px 24px;font-size:16px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:8px}
        .dots{display:flex;gap:4px;padding:8px}
        .dots span{width:6px;height:6px;background:#00d9ff;border-radius:50%;animation:wave 1.2s infinite}
        @keyframes wave{0%,60%,100%{opacity:0.3}30%{opacity:1}}
    </style>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <h1 style="color:#fff">🇳🇬 <span style="color:#00d9ff">ARIA</span></h1>
    <button class="login-btn" id="googleSignInBtn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" height="20" alt="G"> Sign in with Google
    </button>
</div>
<div id="app" style="display:none">
    <div class="hdr">
        <h1>🇳🇬 <span>ARIA</span></h1>
        <div class="user-info" id="userInfo">
            <img id="userAvatar" src="">
            <span id="userName"></span>
            <button id="logoutBtn" class="logout-btn">Sign out</button>
        </div>
    </div>
    <div class="chat" id="chat"></div>
    <div class="inp-outer">
        <div class="inp-pill">
            <textarea id="inp" placeholder="Talk to ARIA..." rows="1" disabled></textarea>
            <button class="send" id="sendBtn" disabled>Send</button>
        </div>
    </div>
    <div class="ftr" id="ftr">⭐ Rate ARIA's last response</div>
</div>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
        authDomain: "fiducia-148b9.firebaseapp.com",
        projectId: "fiducia-148b9",
        storageBucket: "fiducia-148b9.firebasestorage.app",
        messagingSenderId: "380888909038",
        appId: "1:380888909038:web:efe40c252537e670959fff"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const loginOverlay = document.getElementById("loginOverlay");
    const appDiv = document.getElementById("app");
    const chatDiv = document.getElementById("chat");
    const inp = document.getElementById("inp");
    const sendBtn = document.getElementById("sendBtn");
    const userInfoDiv = document.getElementById("userInfo");
    const userAvatar = document.getElementById("userAvatar");
    const userNameSpan = document.getElementById("userName");
    const logoutBtn = document.getElementById("logoutBtn");

    let currentUser = null;
    let lastRatingBar = null;

    marked.setOptions({breaks:true, gfm:true});

    function now() {
        return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    }

    function addMsg(text, sender, rate=false) {
        const row = document.createElement("div");
        row.className = "msg-row " + sender;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (sender === "aria") {
            if (text === "...") {
                bubble.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
            } else {
                bubble.innerHTML = marked.parse(text);
            }
        } else {
            bubble.textContent = text;
        }
        const timestamp = document.createElement("div");
        timestamp.className = "ts";
        timestamp.innerText = now();
        row.appendChild(bubble);
        row.appendChild(timestamp);
        if (sender === "aria" && rate) {
            const rateRow = document.createElement("div");
            rateRow.style.display = "flex";
            rateRow.style.gap = "8px";
            rateRow.style.marginTop = "8px";
            [["👎",1],["😐",2],["👍",3],["🔥",4],["💯",5]].forEach(([emoji,val]) => {
                const btn = document.createElement("button");
                btn.innerText = emoji;
                btn.style.background = "transparent";
                btn.style.border = "1px solid #00d9ff";
                btn.style.borderRadius = "20px";
                btn.style.padding = "4px 10px";
                btn.style.cursor = "pointer";
                btn.onclick = () => doRate(val, rateRow);
                rateRow.appendChild(btn);
            });
            row.appendChild(rateRow);
            lastRatingBar = rateRow;
        }
        chatDiv.appendChild(row);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return row;
    }

    function doRate(score, bar) {
        if (!currentUser) return;
        fetch("/feedback", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({user_id: currentUser.uid, score: score})
        }).catch(()=>{});
        bar.innerHTML = "<span style='color:#00d9ff'>✓ Rated " + score + "/5</span>";
    }

    async function sendMessage() {
        const msg = inp.value.trim();
        if (!msg || !currentUser) return;
        addMsg(msg, "user");
        inp.value = "";
        inp.style.height = "auto";
        const loadingMsg = addMsg("...", "aria", false);
        try {
            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: msg, user_id: currentUser.uid})
            });
            const data = await res.json();
            loadingMsg.remove();
            addMsg(data.reply || "No response", "aria", true);
        } catch(e) {
            loadingMsg.remove();
            addMsg("Connection error. Try again.", "aria", false);
        }
    }

    function enableChat(enable) {
        inp.disabled = !enable;
        sendBtn.disabled = !enable;
        if (enable) inp.focus();
    }

    function signInWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(console.error);
    }

    // Attach sign-in handler to button
    document.getElementById("googleSignInBtn").onclick = signInWithGoogle;

    auth.onAuthStateChanged(async (user) => {
    if (user) {
        currentUser = user;
        loginOverlay.style.display = "none";
        appDiv.style.display = "flex";
        userInfoDiv.style.display = "flex";
        userAvatar.src = user.photoURL || "";
        userNameSpan.innerText = user.displayName || user.email;
        
        // Send name to backend and get aria_uid
        try {
            const nameRes = await fetch("/set_user_name", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    user_id: user.uid,
                    email: user.email,
                    name: user.displayName || user.email.split("@")[0]
                })
            });
            
            const nameData = await nameRes.json();
            
            // Store aria_uid and email in localStorage for /chat calls
            if (nameData.aria_uid) {
                localStorage.setItem("aria_uid", nameData.aria_uid);
                localStorage.setItem("user_email", user.email);
                console.log("✅ User data stored. ARIA UID:", nameData.aria_uid);
            } else {
                console.log("⚠️ No aria_uid returned. Using Firebase UID.");
                localStorage.setItem("user_email", user.email);
            }
        } catch(e) {
            console.log("Failed to send name:", e);
            localStorage.setItem("user_email", user.email);
        }
        
        enableChat(true);
    } else {
        currentUser = null;
        loginOverlay.style.display = "flex";
        appDiv.style.display = "none";
        enableChat(false);
    }
});

    logoutBtn.onclick = () => auth.signOut();
    sendBtn.onclick = sendMessage;
    inp.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey && currentUser) {
            e.preventDefault();
            sendMessage();
        }
    });
    document.getElementById("ftr").onclick = () => {
        if (lastRatingBar) lastRatingBar.scrollIntoView({behavior:"smooth"});
    };
</script>
</body>
</html>
