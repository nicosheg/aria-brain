<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARIA — Personal Intelligence System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #03050A;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Cosmic layers */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, #0B1120 0%, #03050A 100%);
      z-index: 0;
    }
    .milky-way {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 140%;
      height: 140%;
      background: radial-gradient(ellipse at 35% 35%, 
        rgba(80, 70, 150, 0.25) 0%,
        rgba(100, 80, 180, 0.15) 20%,
        rgba(60, 50, 120, 0.08) 50%,
        transparent 80%);
      transform: rotate(32deg);
      pointer-events: none;
      z-index: 0;
      filter: blur(45px);
    }
    .nebula-dust {
      position: fixed;
      top: -120px;
      left: -120px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(90, 70, 160, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }
    .star-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    /* Main layout – bottom block sticks to bottom */
    .app-container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 24px;
      background: transparent;
    }
    /* Header (sign out) */
    .header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 28px;
    }
    .user-signout {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 6px 14px 4px;
      cursor: pointer;
    }
    .user-signout:hover {
      background: rgba(255,255,255,0.06);
    }
    .user-initials {
      font-size: 13px;
      font-weight: 500;
      color: #E2E8F0;
    }
    .signout-label {
      font-size: 7px;
      color: #7A8AAA;
      margin-top: 1px;
    }
    /* Centered welcome message */
    .center-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .greeting {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: -0.3px;
      color: #F0F4FA;
    }
    .greeting span {
      font-weight: 500;
      color: #A78BFA;
    }
    .timestamp {
      font-size: 12px;
      color: #7A8AAA;
      margin-top: 8px;
      opacity: 0.7;
    }
    /* Bottom block – cards, divider, input, footer */
    .bottom-block {
      margin-top: auto;
      width: 100%;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .feature-card {
      background: rgba(18,25,45,0.5);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 10px 8px 8px;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s;
    }
    .feature-card:hover {
      background: rgba(18,25,45,0.7);
    }
    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .card-memory .card-icon { background: rgba(167,139,250,0.12); }
    .card-education .card-icon { background: rgba(96,165,250,0.12); }
    .card-income .card-icon { background: rgba(16,185,129,0.12); }
    .card-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke-width: 1.5;
    }
    .card-memory .card-icon svg { stroke: #A78BFA; }
    .card-education .card-icon svg { stroke: #60A5FA; }
    .card-income .card-icon svg { stroke: #10B981; }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: white;
    }
    .card-desc {
      font-size: 8px;
      color: #9CA3AF;
      margin-top: 2px;
      line-height: 1.2;
    }
    .divider {
      text-align: center;
      margin: 12px 0 12px;
    }
    .divider-text {
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #60A5FA;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.6;
    }
    .input-capsule {
      background: #0A0F1A;
      border: 1px solid #3B82F6;
      border-radius: 50px;
      padding: 8px 14px 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .input-icon-left svg {
      width: 16px;
      height: 16px;
      stroke: #60A5FA;
    }
    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      outline: none;
      padding: 8px 0;
    }
    .input-field::placeholder {
      color: #334155;
    }
    .send-circle {
      width: 34px;
      height: 34px;
      background: transparent;
      border: 1px solid #1E40AF;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .send-circle svg {
      width: 14px;
      height: 14px;
      stroke: #3B82F6;
      stroke-width: 2;
    }
    .footer-note {
      text-align: center;
      padding: 8px 0 12px;
      font-size: 10px;
      color: #4A5A7A;
      border-top: 0.5px solid rgba(255,255,255,0.04);
    }
    /* Chat overlay */
    .chat-view {
      position: fixed;
      inset: 0;
      background: rgba(3,5,10,0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    .chat-view.active { display: flex; }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }
    .chat-actions {
      display: flex;
      gap: 12px;
    }
    .chat-action {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .chat-action.copy { color: #60A5FA; }
    .chat-action.speak { color: #A78BFA; }
    .chat-action.history { color: #F59E0B; font-size: 18px; }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }
    .message {
      max-width: 80%;
      animation: fadeUp 0.2s ease;
    }
    .message.user { align-self: flex-end; }
    .message.aria { align-self: flex-start; }
    .message-bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      color: white;
    }
    .message.user .message-bubble {
      background: rgba(96,165,250,0.2);
      border: 0.5px solid rgba(96,165,250,0.3);
    }
    .message-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      opacity: 0;
      transition: 0.2s;
    }
    .message:hover .message-actions { opacity: 0.7; }
    .message-action {
      background: transparent;
      border: none;
      font-size: 12px;
      cursor: pointer;
      color: #9CA3AF;
    }
    .message-action:hover { color: #60A5FA; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    .history-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .history-container {
      background: rgba(10,20,40,0.95);
      border-radius: 24px;
      max-width: 90%;
      width: 500px;
      max-height: 80%;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .history-item {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid rgba(255,255,255,0.1);
    }
    .history-user { font-size: 12px; color: #60A5FA; }
    .history-aria { font-size: 12px; color: #A78BFA; margin-top: 4px; }
    .close-history {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      float: right;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      .app-container { padding: 16px; }
      .greeting { font-size: 22px; }
    }
  </style>
</head>

  <script>
  // -------------------------------------------------------------
  // COSMIC BACKGROUND (canvas) – twinkling stars, Milky Way, clouds, constellation, shooting stars
  // -------------------------------------------------------------
  (function() {
    const canvas = document.getElementById('cosmicCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    // Helper
    function random(min, max) { return min + Math.random() * (max - min); }

    // ---------------------------------------------------------
    // 1. Stars (many, tiny, dim)
    // ---------------------------------------------------------
    const STAR_COUNT = 4500;
    let stars = [];
    let brightStars = [];
    const BRIGHT_STAR_COUNT = 18;

    // Twinkling data (for all stars)
    let starTwinkle = []; // phase and speed

    // ---------------------------------------------------------
    // 2. Constellation
    // ---------------------------------------------------------
    let constellationStars = [];
    let constellationEdges = [];
    const CONSTELLATION_COUNT = 12;

    // ---------------------------------------------------------
    // 3. Shooting stars (animated)
    // ---------------------------------------------------------
    class ShootingStar {
      constructor(x, y, angle, length, width, brightness, lifespan) {
        this.x = x; this.y = y; this.angle = angle; this.length = length;
        this.width = width; this.brightness = brightness;
        this.life = lifespan; this.maxLife = lifespan;
      }
      update() { this.life--; }
      isAlive() { return this.life > 0; }
      draw(ctx, w, h) {
        const progress = 1 - (this.life / this.maxLife);
        const startX = this.x * w;
        const startY = this.y * h;
        const endX = startX + Math.cos(this.angle) * this.length * w;
        const endY = startY + Math.sin(this.angle) * this.length * h;
        const fade = Math.max(0, 1 - progress * 1.2);
        const bright = this.brightness * fade;
        if (bright <= 0.02) return;
        const grad = ctx.createLinearGradient(startX, startY, endX, endY);
        grad.addColorStop(0, `rgba(220, 240, 255, ${bright * 0.5})`);
        grad.addColorStop(0.6, `rgba(220, 240, 255, ${bright * 0.15})`);
        grad.addColorStop(1, `rgba(220, 240, 255, 0)`);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = grad;
        ctx.lineWidth = this.width;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(startX, startY, 1.0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 250, 240, ${bright * 0.6})`;
        ctx.fill();
      }
    }

    let shootingStars = [];
    let frame = 0;
    const SHOOTING_STAR_PROB = 0.006;
    const SHOOTING_STAR_LIFE = 80;

    // ---------------------------------------------------------
    // Initialisation
    // ---------------------------------------------------------
    function initStars() {
      stars = [];
      starTwinkle = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random(),
          y: Math.random(),
          radius: random(0.12, 0.55),
          baseOpacity: random(0.02, 0.15)
        });
        starTwinkle.push({
          speed: random(0.005, 0.02),
          phase: random(0, Math.PI * 2)
        });
      }
      brightStars = [];
      for (let i = 0; i < BRIGHT_STAR_COUNT; i++) {
        brightStars.push({
          x: Math.random(),
          y: Math.random(),
          radius: random(0.7, 1.2),
          opacity: random(0.5, 0.85),
          spikeLen: random(3, 5)
        });
      }
    }

    function initConstellation() {
      const centerX = 0.25, centerY = 0.3;
      constellationStars = [];
      for (let i = 0; i < CONSTELLATION_COUNT; i++) {
        constellationStars.push({
          x: centerX + (Math.random() - 0.5) * 0.12,
          y: centerY + (Math.random() - 0.5) * 0.12,
          radius: random(0.6, 1.0),
          opacity: random(0.6, 0.9)
        });
      }
      constellationEdges = [];
      for (let i = 0; i < constellationStars.length; i++) {
        for (let j = i+1; j < constellationStars.length; j++) {
          const dx = constellationStars[i].x - constellationStars[j].x;
          const dy = constellationStars[i].y - constellationStars[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.08 && Math.random() < 0.3) {
            constellationEdges.push({ i, j });
          }
        }
      }
    }

    // ---------------------------------------------------------
    // Background layers (gradients, Milky Way, clouds)
    // ---------------------------------------------------------
    function drawBaseGradient() {
      const grad = ctx.createLinearGradient(0, 0, width * 0.85, height);
      grad.addColorStop(0, '#01030A');
      grad.addColorStop(0.5, '#020514');
      grad.addColorStop(1, '#03081A');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function drawMilkyWayGlow() {
      const startX = width * 0.94, startY = height * 0.92;
      const endX = width * 0.06, endY = height * 0.08;
      const grad = ctx.createLinearGradient(startX, startY, endX, endY);
      grad.addColorStop(0, 'rgba(20,30,60,0)');
      grad.addColorStop(0.3, 'rgba(45,75,115,0.07)');
      grad.addColorStop(0.6, 'rgba(60,90,135,0.12)');
      grad.addColorStop(0.8, 'rgba(50,80,120,0.08)');
      grad.addColorStop(1, 'rgba(35,50,80,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
    }

    function drawCloudClusters() {
      const clusters = [
        { cx: 0.72, cy: 0.74, radius: 0.42, r: 25, g: 55, b: 120, intensity: 0.65 },
        { cx: 0.28, cy: 0.26, radius: 0.36, r: 30, g: 60, b: 125, intensity: 0.55 },
        { cx: 0.50, cy: 0.52, radius: 0.32, r: 20, g: 50, b: 115, intensity: 0.5 },
        { cx: 0.85, cy: 0.45, radius: 0.28, r: 35, g: 65, b: 130, intensity: 0.45 },
        { cx: 0.15, cy: 0.70, radius: 0.30, r: 25, g: 55, b: 120, intensity: 0.5 },
        { cx: 0.38, cy: 0.85, radius: 0.25, r: 30, g: 60, b: 125, intensity: 0.4 }
      ];
      for (let c of clusters) {
        const cx = c.cx * width;
        const cy = c.cy * height;
        const rad = c.radius * width;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        grad.addColorStop(0, `rgba(${c.r}, ${c.g}, ${c.b}, ${0.035 * c.intensity})`);
        grad.addColorStop(1, `rgba(${c.r}, ${c.g}, ${c.b}, 0)`);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }
    }

    // ---------------------------------------------------------
    // Star drawing (with twinkling)
    // ---------------------------------------------------------
    let time = 0;
    function drawStars() {
      time += 0.016;
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const t = starTwinkle[i];
        const twinkle = 0.6 + 0.4 * Math.sin(time * t.speed + t.phase);
        const opacity = s.baseOpacity * twinkle;
        ctx.beginPath();
        ctx.arc(s.x * width, s.y * height, s.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(210, 225, 255, ${opacity})`;
        ctx.fill();
      }
      // Bright stars (no twinkle, but subtle)
      for (let b of brightStars) {
        const cx = b.x * width, cy = b.y * height;
        ctx.beginPath();
        ctx.arc(cx, cy, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(240, 245, 255, ${b.opacity})`;
        ctx.fill();
        // tiny spikes
        const len = b.spikeLen;
        ctx.beginPath();
        ctx.moveTo(cx - len, cy); ctx.lineTo(cx + len, cy);
        ctx.moveTo(cx, cy - len); ctx.lineTo(cx, cy + len);
        ctx.strokeStyle = `rgba(240, 245, 255, ${b.opacity * 0.4})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }

    function drawConstellation() {
      ctx.beginPath();
      for (let edge of constellationEdges) {
        const s1 = constellationStars[edge.i];
        const s2 = constellationStars[edge.j];
        ctx.moveTo(s1.x * width, s1.y * height);
        ctx.lineTo(s2.x * width, s2.y * height);
      }
      ctx.strokeStyle = 'rgba(140, 180, 230, 0.2)';
      ctx.lineWidth = 0.8;
      ctx.stroke();
      for (let cs of constellationStars) {
        ctx.beginPath();
        ctx.arc(cs.x * width, cs.y * height, cs.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 220, 255, ${cs.opacity})`;
        ctx.fill();
      }
    }

    function updateShootingStars() {
      shootingStars = shootingStars.filter(ss => ss.isAlive());
      if (shootingStars.length < 2 && Math.random() < SHOOTING_STAR_PROB) {
        const x = random(0.1, 0.7);
        const y = random(0.05, 0.4);
        const angle = random(-0.85, -0.2);
        const length = random(0.03, 0.06);
        const width = random(0.5, 0.8);
        const brightness = random(0.3, 0.55);
        const life = Math.floor(SHOOTING_STAR_LIFE * random(0.8, 1.2));
        shootingStars.push(new ShootingStar(x, y, angle, length, width, brightness, life));
      }
      shootingStars.forEach(ss => ss.update());
    }

    function drawShootingStars() {
      for (let ss of shootingStars) ss.draw(ctx, width, height);
    }

    // ---------------------------------------------------------
    // Render loop
    // ---------------------------------------------------------
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    function render() {
      if (!ctx) return;
      drawBaseGradient();
      drawMilkyWayGlow();
      drawCloudClusters();
      drawStars();
      drawConstellation();
      drawShootingStars();
      updateShootingStars();
      requestAnimationFrame(render);
    }

    function init() {
      initStars();
      initConstellation();
      resizeCanvas();
      render();
    }

    window.addEventListener('resize', () => resizeCanvas());
    init();
  })();
</script>
</body>
</html>
