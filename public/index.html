<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ARIA — Your AI. Your Life. Your Future.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #01030A;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .cosmic-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 45% 30%, #0D1E3A 0%, #071222 35%, #030810 70%, #01030A 100%);
      z-index: 0;
    }
    .space-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 60%;
      background: radial-gradient(ellipse at 50% 0%, rgba(12,28,64,0.5) 0%, rgba(6,14,32,0.2) 50%, transparent 100%);
      pointer-events: none;
      z-index: 1;
    }
    .starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0% { opacity: 0; transform: scale(0.6); }
      40% { opacity: 0.8; transform: scale(1); }
      100% { opacity: 0; transform: scale(0.6); }
    }
    .shooting-star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      box-shadow: 0 0 4px rgba(255,255,240,0.6);
      border-radius: 50%;
      opacity: 0;
      animation: shootVerySlow linear infinite;
    }
    @keyframes shootVerySlow {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 0.8; }
      30% { transform: translate(-80px, 80px); opacity: 0.4; }
      100% { transform: translate(-200px, 200px); opacity: 0; }
    }
    .app-container {
      position: relative;
      z-index: 3;
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 20px 12px;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .main-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      color: white;
    }
    .subtitle {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.8px;
      color: #94A3B8;
      margin-top: 4px;
    }
    .icon-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .icon-btn {
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: white;
      stroke-width: 1.5;
      fill: none;
    }
    .lang-badge {
      background: rgba(0,0,0,0.6);
      border: 0.5px solid rgba(255,255,255,0.3);
      border-radius: 30px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: white;
    }
    .welcome-card {
      background: rgba(10,12,25,0.7);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      backdrop-filter: blur(4px);
      margin-bottom: 8px;
    }
    .welcome-icon {
      width: 48px;
      height: 48px;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .welcome-icon svg {
      width: 24px;
      height: 24px;
      stroke: #60A5FA;
      fill: none;
      stroke-width: 1.5;
    }
    .welcome-greeting {
      font-size: 16px;
      font-weight: 600;
      color: white;
      line-height: 1.4;
    }
    .welcome-greeting span {
      font-weight: 700;
      color: #A78BFA;
    }
    .timestamp {
      font-size: 12px;
      color: #55657E;
      margin-top: 4px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
    }
    .feature-card {
      background: rgba(20,22,40,0.5);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 16px 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s;
    }
    .feature-card:hover { background: rgba(20,22,40,0.7); }
    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }
    .card-memory .card-icon { background: rgba(167,139,250,0.15); }
    .card-education .card-icon { background: rgba(96,165,250,0.15); }
    .card-income .card-icon { background: rgba(16,185,129,0.15); }
    .card-decisions .card-icon { background: rgba(245,158,11,0.15); }
    .card-icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke-width: 1.5;
    }
    .card-memory .card-icon svg { stroke: #A78BFA; }
    .card-education .card-icon svg { stroke: #60A5FA; }
    .card-income .card-icon svg { stroke: #10B981; }
    .card-decisions .card-icon svg { stroke: #F59E0B; }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: white;
    }
    .card-desc {
      font-size: 10px;
      color: #9CA3AF;
      margin-top: 4px;
    }
    .center-divider {
      text-align: center;
      margin: 16px 0 24px;
    }
    .divider-text {
      font-size: 10px;
      letter-spacing: 2px;
      color: #60A5FA;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .input-capsule {
      background: #05070F;
      border: 1.5px solid #3B82F6;
      border-radius: 50px;
      padding: 8px 12px 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      box-shadow: 0 0 8px rgba(59,130,246,0.2);
    }
    .input-icon-left svg {
      width: 18px;
      height: 18px;
      stroke: #60A5FA;
    }
    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      outline: none;
      padding: 8px 0;
    }
    .input-field::placeholder { color: #334155; }
    .send-circle {
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid #1E40AF;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .send-circle svg {
      width: 16px;
      height: 16px;
      stroke: #3B82F6;
      stroke-width: 2;
    }
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 12px 0 0;
      border-top: 0.5px solid rgba(255,255,255,0.06);
      margin-top: auto;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: transparent;
      border: none;
    }
    .nav-icon {
      width: 24px;
      height: 24px;
    }
    .nav-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: #6B7280;
      stroke-width: 1.5;
    }
    .nav-item.active .nav-icon svg { stroke: #3B82F6; }
    .nav-label {
      font-size: 10px;
      font-weight: 500;
      color: #6B7280;
    }
    .nav-item.active .nav-label { color: #3B82F6; }
    .active-dot {
      width: 4px;
      height: 4px;
      background: #3B82F6;
      border-radius: 2px;
      margin-top: 2px;
    }
    .chat-view {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      backdrop-filter: blur(8px);
      z-index: 100;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    .chat-view.active { display: flex; }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .message {
      max-width: 80%;
      animation: fadeIn 0.2s ease;
    }
    .message.user { align-self: flex-end; }
    .message.aria { align-self: flex-start; }
    .message-bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      background: rgba(255,255,255,0.08);
      color: white;
    }
    .user .message-bubble {
      background: rgba(96,165,250,0.2);
      border: 0.5px solid rgba(96,165,250,0.3);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 640px) {
      .cards-grid { gap: 8px; }
      .feature-card { padding: 12px 6px 8px; }
      .card-title { font-size: 12px; }
      .card-desc { font-size: 8px; }
    }
  </style>
</head>
<body>
  <div class="cosmic-bg"></div>
  <div class="space-glow"></div>
  <div class="starfield" id="starfield"></div>

  <div class="app-container" id="mainUI">
    <div class="header">
      <div class="title-section">
        <div class="main-title">ARIA</div>
        <div class="subtitle">Your AI. Your Life. Your Future.</div>
      </div>
      <div class="icon-row">
        <button class="icon-btn" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
        <button class="icon-btn" id="sparkleBtn"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg></button>
        <button class="icon-btn" id="notifBtn"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div class="notif-dot"></div></button>
        <div class="lang-badge">EN</div>
      </div>
    </div>

    <div class="welcome-card">
      <div class="welcome-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <div class="welcome-text"><div class="welcome-greeting">Hey <span id="userName">friend</span>, welcome back.</div></div>
    </div>
    <div class="timestamp" id="timestamp">—</div>

    <div class="cards-grid">
      <div class="feature-card card-memory" data-pillar="Memory">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 1 0 0 18A9 9 0 0 0 12 2z"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></div>
        <div class="card-title">Memory</div><div class="card-desc">Your memories, organized.</div>
      </div>
      <div class="feature-card card-education" data-pillar="Education">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
        <div class="card-title">Education</div><div class="card-desc">Learn, grow, and master.</div>
      </div>
      <div class="feature-card card-income" data-pillar="Income">
        <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div class->card-title">Income</div><div class="card-desc">Track, plan, and grow.</div>
      </div>
      <div class="feature-card card-decisions" data-pillar="Decisions">
        <div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></div>
        <div class="card-title">Decisions</div><div class="card-desc">Get clarity. Make better calls.</div>
      </div>
    </div>

    <div class="center-divider"><div class="divider-text">✦ ONE AI. EVERY PART OF YOUR LIFE. ✦</div></div>

    <div class="input-capsule">
      <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <input type="text" class="input-field" id="mainInput" placeholder="Message ARIA...">
      <div class="send-circle" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" data-tab="chat"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><div class="nav-label">Chat</div><div class="active-dot"></div></div>
      <div class="nav-item" data-tab="memory"><div class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></div><div class="nav-label">Memory</div></div>
      <div class="nav-item" data-tab="insights"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg></div><div class="nav-label">Insights</div></div>
      <div class="nav-item" data-tab="learn"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div><div class="nav-label">Learn</div></div>
      <div class="nav-item" data-tab="profile"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="nav-label">Profile</div></div>
    </div>
  </div>

  <div id="chatView" class="chat-view">
    <div class="chat-header">
      <button class="back-btn" id="closeChatBtn">←</button>
      <div style="color:white; font-weight:500;">ARIA</div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="input-capsule" style="margin-top: auto;">
      <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
      <input type="text" class="input-field" id="chatInput" placeholder="Message ARIA...">
      <div class="send-circle" id="chatSendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
    </div>
  </div>

  <script>
    // ========== CSS STARFIELD GENERATION ==========
    (function() {
      const starfield = document.getElementById('starfield');
      function isNearDiagonal(x, y) { return (x + y) > 1.2; }
      const starCount = 550;
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        let x = Math.random();
        let y = Math.random();
        if (isNearDiagonal(x, y)) {
          star.style.left = (x * 100) + '%';
          star.style.top = (y * 100) + '%';
          star.style.width = (Math.random() * 1.0 + 0.2) + 'px';
          star.style.height = star.style.width;
          star.style.animationDuration = (Math.random() * 8 + 4) + 's';
        } else {
          if (Math.random() > 0.65) continue;
          star.style.left = (x * 100) + '%';
          star.style.top = (y * 100) + '%';
          star.style.width = (Math.random() * 0.8 + 0.1) + 'px';
          star.style.height = star.style.width;
          star.style.animationDuration = (Math.random() * 10 + 6) + 's';
        }
        star.style.animationDelay = (Math.random() * 8) + 's';
        starfield.appendChild(star);
      }
      for (let i = 0; i < 6; i++) {
        const shoot = document.createElement('div');
        shoot.className = 'shooting-star';
        shoot.style.left = (Math.random() * 80 + 10) + '%';
        shoot.style.top = (Math.random() * 60) + '%';
        shoot.style.animationDuration = (Math.random() * 6 + 8) + 's';
        shoot.style.animationDelay = (Math.random() * 30) + 's';
        starfield.appendChild(shoot);
      }
    })();
  </script>
    <script>
    // ========== FIREBASE AUTH ==========
    const firebaseConfig = {
      apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
      authDomain: "fiducia-148b9.firebaseapp.com",
      projectId: "fiducia-148b9",
      storageBucket: "fiducia-148b9.firebasestorage.app",
      messagingSenderId: "380888909038",
      appId: "1:380888909038:web:efe40c252537e670959fff"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let currentUser = null;

    function updateTimestamp() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Lagos' });
      document.getElementById('timestamp').textContent = timeStr;
    }
    updateTimestamp();
    setInterval(updateTimestamp, 60000);

    // ========== CHAT LOGIC ==========
    const mainUI = document.getElementById('mainUI');
    const chatView = document.getElementById('chatView');
    const mainInput = document.getElementById('mainInput');
    const chatInput = document.getElementById('chatInput');
    const messagesArea = document.getElementById('messagesArea');
    const userNameSpan = document.getElementById('userName');

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = marked.parse(text);
      div.appendChild(bubble);
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addTyping() {
      const div = document.createElement('div');
      div.className = 'message aria';
      div.id = 'typingIndicator';
      div.innerHTML = `<div class="message-bubble">✦ ✦ ✦</div>`;
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    function removeTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    async function sendToAria(message, inputElement) {
      if (!currentUser) return;
      addMessage(message, 'user');
      inputElement.value = '';
      addTyping();
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, user_id: currentUser.uid, email: currentUser.email.toLowerCase() })
        });
        const data = await res.json();
        removeTyping();
        if (data.error) addMessage(`Error: ${data.error}`, 'aria');
        else addMessage(data.reply || '...', 'aria');
      } catch(e) { removeTyping(); addMessage('Connection uncertain.', 'aria'); }
    }

    function openChat() {
      mainUI.style.display = 'none';
      chatView.classList.add('active');
      if (messagesArea.children.length === 0 && currentUser) {
        addMessage(`Hey ${currentUser.displayName || currentUser.email.split('@')[0]}. I'm ARIA. What would you like to explore?`, 'aria');
      }
      chatInput.focus();
    }
    function closeChat() {
      mainUI.style.display = 'flex';
      chatView.classList.remove('active');
      messagesArea.innerHTML = '';
    }

    document.querySelectorAll('.feature-card').forEach(card => {
      card.addEventListener('click', () => {
        openChat();
        const pillar = card.querySelector('.card-title').textContent;
        addMessage(`Let's talk about ${pillar}. How can I help?`, 'aria');
      });
    });

    mainInput.addEventListener('focus', openChat);
    document.getElementById('closeChatBtn').addEventListener('click', closeChat);
    document.getElementById('chatSendBtn').addEventListener('click', () => {
      const msg = chatInput.value.trim();
      if (msg) sendToAria(msg, chatInput);
    });
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); const msg = chatInput.value.trim(); if (msg) sendToAria(msg, chatInput); }
    });
    document.getElementById('sendBtn').addEventListener('click', () => {
      const msg = mainInput.value.trim();
      if (msg) sendToAria(msg, mainInput);
    });
    mainInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); const msg = mainInput.value.trim(); if (msg) sendToAria(msg, mainInput); }
    });

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const displayName = user.displayName || user.email.split('@')[0];
        userNameSpan.textContent = displayName;
        try {
          await fetch('/set_user_name', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: user.uid, email: user.email.toLowerCase(), name: displayName })
          });
        } catch(e) { console.warn(e); }
      } else {
        window.location.href = '/login.html';
      }
    });
  </script>
</body>
</html>
