<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>ARIA — Your AI. Your Life. Your Future.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #01030A; font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }
    .cosmic-bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 45% 30%, #0D1E3A 0%, #071222 35%, #030810 70%, #01030A 100%); z-index: 0; }
    .space-glow { position: fixed; top: 0; left: 0; width: 100%; height: 60%; background: radial-gradient(ellipse at 50% 0%, rgba(12,28,64,0.5) 0%, rgba(6,14,32,0.2) 50%, transparent 100%); pointer-events: none; z-index: 1; }
    .starfield { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .star { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: twinkle linear infinite; }
    @keyframes twinkle { 0% { opacity: 0; transform: scale(0.6); } 40% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(0.6); } }
    .shooting-star { position: absolute; width: 2px; height: 2px; background: rgba(255,255,240,0.95); box-shadow: 0 0 6px rgba(255,240,200,0.8); border-radius: 50%; opacity: 0; animation: shootVerySlow linear infinite; }
    @keyframes shootVerySlow { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 30% { transform: translate(-60px, 60px); opacity: 0.6; } 100% { transform: translate(-140px, 140px); opacity: 0; } }
    .app-container { position: relative; z-index: 3; max-width: 430px; margin: 0 auto; min-height: 100vh; padding: 20px 20px 12px; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: flex-end; align-items: flex-start; margin-bottom: 24px; }
    .signout-block { display: flex; flex-direction: column; align-items: center; background: rgba(255,255,255,0.04); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 40px; padding: 6px 14px 4px; cursor: pointer; transition: all 0.2s; }
    .signout-block:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
    .user-initials { font-size: 13px; font-weight: 500; color: #E2E8F0; letter-spacing: 0.5px; }
    .signout-label { font-size: 7px; font-weight: 400; color: #7A8AAA; margin-top: 1px; }
    .title-section { margin-right: auto; }
    .main-title { font-size: 28px; font-weight: 700; letter-spacing: 3px; color: white; }
    .subtitle { font-size: 10px; font-weight: 400; letter-spacing: 0.8px; color: #94A3B8; margin-top: 4px; }
    .center-message { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin: 20px 0; }
    .greeting { font-size: 24px; font-weight: 300; letter-spacing: -0.3px; color: #F0F4FA; }
    .greeting span { font-weight: 500; background: linear-gradient(120deg, #A78BFA, #60A5FA, #10B981); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s linear infinite; }
    @keyframes shimmer { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
    .timestamp { font-size: 12px; color: #7A8AAA; margin-top: 8px; opacity: 0.7; }
    .bottom-block { margin-top: auto; width: 100%; }
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .feature-card { background: rgba(20,22,40,0.5); backdrop-filter: blur(8px); border-radius: 18px; padding: 14px 8px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; border: 0.5px solid rgba(255,255,255,0.05); cursor: pointer; transition: all 0.2s; }
    .feature-card:hover { background: rgba(20,22,40,0.7); }
    .card-icon { width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .card-memory .card-icon { background: rgba(167,139,250,0.15); }
    .card-education .card-icon { background: rgba(96,165,250,0.15); }
    .card-income .card-icon { background: rgba(16,185,129,0.15); }
    .card-icon svg { width: 18px; height: 18px; fill: none; stroke-width: 1.5; }
    .card-memory .card-icon svg { stroke: #A78BFA; }
    .card-education .card-icon svg { stroke: #60A5FA; }
    .card-income .card-icon svg { stroke: #10B981; }
    .card-title { font-size: 13px; font-weight: 600; color: white; margin-bottom: 2px; }
    .card-desc { font-size: 9px; color: #9CA3AF; }
    .divider { text-align: center; margin: 8px 0 16px; }
    .divider-text { font-size: 9px; letter-spacing: 1.5px; color: #60A5FA; display: inline-flex; align-items: center; gap: 6px; opacity: 0.6; }
    .input-capsule { background: #0A0F1A; border: 1.5px solid #3B82F6; border-radius: 50px; padding: 8px 12px 8px 18px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; box-shadow: 0 0 8px rgba(59,130,246,0.1); }
    .input-icon-left svg { width: 16px; height: 16px; stroke: #60A5FA; }
    .input-field { flex: 1; background: transparent; border: none; color: white; font-size: 14px; outline: none; padding: 8px 0; resize: none; min-height: 42px; max-height: 120px; font-family: inherit; line-height: 1.4; }
    .input-field::placeholder { color: #334155; }
    .send-circle { width: 34px; height: 34px; background: transparent; border: 1px solid #1E40AF; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .send-circle svg { width: 14px; height: 14px; stroke: #3B82F6; stroke-width: 2; }
    .upload-btn { background: rgba(96,165,250,0.15); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #60A5FA; transition: all 0.25s ease; border: 0.5px solid rgba(96,165,250,0.3); position: relative; flex-shrink: 0; }
    .upload-btn:hover { background: rgba(96,165,250,0.3); color: #A78BFA; transform: scale(1.05); border-color: #A78BFA; box-shadow: 0 0 12px rgba(96,165,250,0.5); }
    .upload-btn svg { width: 18px; height: 18px; }
    .upload-btn::after { content: "Upload (image/PDF)"; position: absolute; bottom: 45px; background: rgba(0,0,0,0.8); color: white; font-size: 10px; padding: 4px 8px; border-radius: 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; font-weight: 400; }
    .upload-btn:hover::after { opacity: 1; }
    @media (max-width: 640px) { .upload-btn::after { font-size: 9px; bottom: 40px; } }
    .footer { text-align: center; padding: 8px 0 12px; font-size: 10px; letter-spacing: 0.6px; color: #4A5A7A; border-top: 0.5px solid rgba(255,255,255,0.04); width: 100%; }
    .chat-view { position: fixed; inset: 0; background: transparent; z-index: 100; padding: 20px; display: none; flex-direction: column; }
    .chat-content { flex: 1; min-height: 0; display: flex; gap: 14px; }
    .chat-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    @media (max-width: 760px) { .chat-content { flex-direction: column; gap: 10px; } .recent-panel { width: 100%; flex: 0 0 auto; max-height: 150px; border-radius: 18px; } .recent-panel-header { padding: 10px 10px 8px; } .recent-list { padding: 7px; } .recent-item { display: none; } .recent-item:nth-child(-n+3) { display: block; } }
    .chat-view.active { display: flex; }
    .chat-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .back-btn { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border: none; color: white; font-size: 26px; cursor: pointer; width: 40px; height: 40px; border-radius: 30px; display: flex; align-items: center; justify-content: center; }
    .chat-actions { display: flex; gap: 12px; margin-left: auto; }
    .chat-action { background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); border: none; font-size: 18px; cursor: pointer; color: white; width: 40px; height: 40px; border-radius: 30px; display: flex; align-items: center; justify-content: center; transition: 0.1s; }
    .chat-action:hover { background: rgba(0,0,0,0.6); }
    .messages-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
    .message { max-width: 80%; animation: fadeIn 0.2s ease; }
    .message.user { align-self: flex-end; }
    .message.aria { align-self: flex-start; }
    .message-bubble { padding: 10px 14px; border-radius: 20px; font-size: 14px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); color: white; }
    .user .message-bubble { background: rgba(96,165,250,0.3); border: 0.5px solid rgba(96,165,250,0.5); }
    .message-actions { display: flex; gap: 8px; margin-top: 6px; opacity: 0; transition: opacity 0.2s; }
    .message:hover .message-actions { opacity: 0.8; }
    .message-action { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); border: none; font-size: 12px; cursor: pointer; color: white; padding: 4px 8px; border-radius: 16px; }
    .message-action:hover { background: rgba(0,0,0,0.6); }
    .chat-starters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 4px; padding: 0 2px; }
    .chat-starter { border: 1px solid rgba(96,165,250,0.18); background: rgba(96,165,250,0.07); color: rgba(255,255,255,0.72); border-radius: 16px; padding: 8px 11px; cursor: pointer; font: inherit; font-size: 10px; text-align: left; transition: .18s ease; }
    .chat-starter:hover { background: rgba(96,165,250,0.13); border-color: rgba(96,165,250,0.32); color: #fff; transform: translateY(-1px); }
    .rating-row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 6px; padding: 2px 0; }
    .rating-star { width: 18px; height: 18px; cursor: pointer; fill: none; stroke: rgba(255, 255, 255, 0.3); stroke-width: 1.5; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s, fill 0.2s; }
    .rating-star.active { fill: #ffffff; stroke: #3b82f6; filter: drop-shadow(0 0 5px rgba(59, 130, 246, 0.8)) drop-shadow(0 0 10px rgba(167, 139, 250, 0.4)); transform: scale(1.05); }
    @media (max-width: 640px) { .rating-star { width: 22px; height: 22px; } .rating-row { gap: 8px; } }
    .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); border-radius: 20px; width: fit-content; animation: glowPulse 1.2s infinite; }
    .typing-dot { width: 6px; height: 6px; background: #60A5FA; border-radius: 50%; animation: dotBounce 1.2s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
    @keyframes glowPulse { 0% { box-shadow: 0 0 0 rgba(96,165,250,0); } 50% { box-shadow: 0 0 10px rgba(96,165,250,0.3); } 100% { box-shadow: 0 0 0 rgba(96,165,250,0); } }
    .history-modal { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; box-sizing: border-box; background: rgba(2,6,16,0.88); backdrop-filter: blur(14px); z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.22s ease; padding: 3vh 3vw; }
    .history-modal.active { opacity: 1; pointer-events: auto; }
    .history-container { box-sizing: border-box; background: linear-gradient(150deg, rgba(12,24,46,0.99), rgba(5,11,24,0.99)); border-radius: 24px; width: 100%; max-width: none; height: 100%; max-height: none; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 24px 80px rgba(0,0,0,0.48); display: flex; flex-direction: column; }
    .history-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 12px; }
    .history-heading { min-width: 0; }
    .history-title { margin: 0; font-size: 19px; color: #fff; font-weight: 600; }
    .history-subtitle { margin-top: 4px; font-size: 11px; color: rgba(255,255,255,0.48); }
    .history-toolbar { padding: 0 20px 14px; display: flex; gap: 10px; }
    .history-search { flex: 1; min-width: 0; height: 42px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.1); outline: none; background: rgba(255,255,255,0.045); color: #fff; padding: 0 13px; font: inherit; font-size: 13px; }
    .history-search::placeholder { color: rgba(255,255,255,0.35); }
    .history-refresh { width: 42px; height: 42px; border-radius: 13px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.045); color: rgba(255,255,255,0.8); cursor: pointer; }
    .history-list { overflow-y: auto; padding: 0 14px 18px; }
    .history-day { margin: 8px 6px 10px; color: rgba(255,255,255,0.4); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; }
    .history-item { margin: 0 6px 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.085); border-radius: 17px; background: rgba(255,255,255,0.028); transition: border-color .18s ease, background .18s ease; }
    .history-item:hover, .history-item.expanded { border-color: rgba(125,166,255,0.24); background: rgba(255,255,255,0.042); }
    .history-item-toggle { display: block; width: 100%; border: 0; text-align: left; background: transparent; color: inherit; padding: 15px 17px; cursor: pointer; font: inherit; }
    .history-item-toggle:focus-visible { outline: 2px solid rgba(141,183,255,0.9); outline-offset: -3px; border-radius: 16px; }
    .history-item-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .history-item-title { min-width: 0; color: rgba(255,255,255,0.95); font-size: 14px; line-height: 1.45; font-weight: 600; overflow-wrap: anywhere; }
    .history-item-side { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; color: rgba(255,255,255,0.45); font-size: 11px; white-space: nowrap; }
    .history-status { font-size: 10px; color: #9ce5bd; text-transform: none; letter-spacing: 0.01em; }
    .history-status.failed { color: #ffaaaa; }
    .history-item-summary { margin-top: 8px; color: rgba(255,255,255,0.52); font-size: 12px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .history-chevron { width: 16px; height: 16px; flex: 0 0 auto; color: rgba(255,255,255,0.45); transition: transform .18s ease; }
    .history-item.expanded .history-chevron { transform: rotate(180deg); }
    .history-thread { border-top: 1px solid rgba(255,255,255,0.075); padding: 18px; display: flex; flex-direction: column; gap: 13px; }
    .history-thread[hidden] { display: none; }
    .history-message { display: flex; flex-direction: column; gap: 5px; max-width: 88%; min-width: 0; }
    .history-message.user { align-self: flex-end; align-items: flex-end; }
    .history-message.aria { align-self: flex-start; align-items: flex-start; }
    .history-message-head { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.48); font-size: 10px; letter-spacing: 0.025em; }
    .history-message.user .history-message-head { justify-content: flex-end; }
    .history-message-label { color: rgba(255,255,255,0.8); font-weight: 600; }
    .history-message-content { color: rgba(255,255,255,0.86); background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.065); border-radius: 5px 17px 17px 17px; padding: 12px 14px; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; width: fit-content; max-width: 100%; }
    .history-message.user .history-message-content { color: #eff6ff; background: rgba(74,132,224,0.16); border-color: rgba(120,169,255,0.20); border-radius: 17px 5px 17px 17px; }
    .history-message-content p { margin: 0 0 9px; }
    .history-message-content p:last-child { margin-bottom: 0; }
    .history-message-content ul, .history-message-content ol { margin: 7px 0; padding-left: 22px; }
    .history-message-content code { overflow-wrap: anywhere; }
    .history-thread-state { padding: 12px 4px; color: rgba(255,255,255,0.48); font-size: 12px; text-align: center; }    .close-history { background: transparent; border: none; color: white; font-size: 20px; float: right; cursor: pointer; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) { .cards-grid { gap: 8px; } .feature-card { padding: 10px 4px 6px; } .card-title { font-size: 11px; } .card-desc { font-size: 8px; } .card-icon { width: 30px; height: 30px; } .card-icon svg { width: 16px; height: 16px; } }
    .history-new { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; flex: 0 0 auto; padding: 0 13px; border: 1px solid rgba(125,166,255,0.20); border-radius: 13px; background: rgba(91,139,229,0.11); color: #e4edff; cursor: pointer; font: inherit; font-size: 12px; }
    .history-new:hover { background: rgba(91,139,229,0.19); }
    .history-new svg, .history-refresh svg { width: 17px; height: 17px; }
    @media (max-width: 640px) {
      .history-modal { padding: 8px; }
      .history-container { border-radius: 17px; }
      .history-header { padding: 15px 15px 11px; }
      .history-title { font-size: 18px; }
      .history-toolbar { padding: 0 13px 12px; gap: 7px; }
      .history-search { height: 40px; font-size: 12px; padding: 0 10px; }
      .history-new { height: 40px; padding: 0 10px; font-size: 0; gap: 0; }
      .history-new svg { width: 18px; height: 18px; }
      .history-refresh { width: 40px; height: 40px; }
      .history-list { padding: 0 8px 12px; }
      .history-item-toggle { padding: 13px; }
      .history-item-title { font-size: 13px; }
      .history-item-side { gap: 6px; font-size: 10px; }
      .history-item-summary { font-size: 11px; }
      .history-thread { padding: 12px; gap: 12px; }
      .history-message { max-width: 96%; }
      .history-message-content { font-size: 12px; padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <div class="cosmic-bg"></div>
  <div class="space-glow"></div>
  <div class="starfield" id="starfield"></div>
  <div class="app-container" id="mainUI">
    <div class="header">
      <div class="title-section">
        <div class="main-title">ARIA</div>
        <div class="subtitle">Your AI. Your Life. Your Future.</div>
      </div>
      <div class="signout-block" id="signoutBtn">
        <div class="user-initials" id="userInitials">EN</div>
        <div class="signout-label">sign out</div>
      </div>
    </div>
    <div class="center-message">
      <div class="greeting">Hey <span id="userName">friend</span>.</div>
      <div class="timestamp" id="timestamp">—</div>
    </div>
    <div class="bottom-block">
      <div class="cards-grid">
        <div class="feature-card card-memory" data-pillar="Memory">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 1 0 0 18A9 9 0 0 0 12 2z"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></div>
          <div class="card-title">Memory</div><div class="card-desc">Your memories, organized.</div>
        </div>
        <div class="feature-card card-education" data-pillar="Education">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
          <div class="card-title">Education</div><div class="card-desc">Learn, grow, and master.</div>
        </div>
        <div class="feature-card card-income" data-pillar="Income">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          <div class="card-title">Income</div><div class="card-desc">Track, plan, and grow.</div>
        </div>
      </div>
      <div class="divider"><div class="divider-text">💫 ONE AI. EVERY PART OF YOUR LIFE. 💫</div></div>
      <div class="input-capsule">
        <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
        <textarea class="input-field" id="mainInput" rows="1" placeholder="Message ARIA..."></textarea>
        <div class="send-circle" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
        <div class="upload-btn" id="uploadBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
            <path d="M12 2v5m-2-2 2-2 2 2"/>
          </svg>
        </div>
      </div>
      <div class="footer">By MrNicosh Eg</div>
    </div>
  </div>
  <div id="chatView" class="chat-view">
    <div class="chat-header"><button class="back-btn" id="closeChatBtn" aria-label="Back to home">←</button><div style="color:white; font-weight:500;">ARIA</div><div class="chat-actions"><button class="chat-action" id="historyBtn" title="Conversation history" aria-label="Open conversation history"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></button></div></div>
    <div class="chat-content">

  <script>
    // ── Stars ──
    (function() {

        } else {

        shoot.className = 'shooting-star';

        starfield.appendChild(shoot);
      }
    })();

    // ── Firebase ──
    const firebaseConfig = {
      apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
      authDomain: "fiducia-148b9.firebaseapp.com",
      projectId: "fiducia-148b9",
      storageBucket: "fiducia-148b9.firebasestorage.app",
      messagingSenderId: "380888909038",
      appId: "1:380888909038:web:efe40c252537e670959fff"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let currentUser = null;
    let firebaseIdToken = null;
    let lastAriaMessage = null;
    let chatBusy = false;
    let conversationId = null;
    let conversations = [];
    let recentSearchTerm = '';

    // ── Authenticated API helper ──
    async function apiHeaders(extra = {}, forceRefresh = false) {
      if (!currentUser) return extra;
      if (!firebaseIdToken || forceRefresh) firebaseIdToken = await currentUser.getIdToken(forceRefresh);
      return { ...extra, 'Authorization': `Bearer ${firebaseIdToken}` };
    }

    async function authenticatedFetch(url, options = {}) {
      const headers = await apiHeaders(options.headers || {});
      let response = await fetch(url, { ...options, headers });
      if (response.status === 401 && currentUser) {
        firebaseIdToken = null;
        const refreshedHeaders = await apiHeaders(options.headers || {}, true);
        response = await fetch(url, { ...options, headers: refreshedHeaders });
      }
      return response;
    }

    function safeMarkdown(text) {
      const raw = (window.marked && typeof marked.parse === 'function')
        ? marked.parse(String(text ?? ''))
        : String(text ?? '').replace(/[&<>"']/g, (ch) => ({
            '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
          }[ch]));
      const doc = new DOMParser().parseFromString(raw, 'text/html');
      doc.querySelectorAll('script,style,iframe,object,embed,form,link,meta,base').forEach((node) => node.remove());
      doc.querySelectorAll('*').forEach((el) => {
        Array.from(el.attributes).forEach((attr) => {
          const name = attr.name.toLowerCase();
          const value = attr.value.trim();
          if (name.startsWith('on') || name === 'srcdoc') {
            el.removeAttribute(attr.name);
            return;
          }
          if ((name === 'href' || name === 'src') && /^(javascript|vbscript|data):/i.test(value)) {
            el.removeAttribute(attr.name);
          }
        });
      });
      return doc.body.innerHTML;
    }

    function showApproval(runId, interruptions) {
      const div = document.createElement('div');
      div.className = 'message aria';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';

      const title = document.createElement('strong');
      title.textContent = 'Approval needed';
      bubble.appendChild(title);

      (interruptions || []).forEach((item) => {
        const detail = document.createElement('div');
        detail.style.cssText = 'font-size:11px;margin-top:6px;color:#CBD5E1;';
        detail.textContent = `${item.tool || 'external action'}: ${item.arguments || ''}`;
        bubble.appendChild(detail);
      });

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;margin-top:10px;';

      const approve = document.createElement('button');
      approve.className = 'message-action';
      approve.textContent = 'Approve';
      approve.onclick = () => resumeApproval(runId, true, div);

      const reject = document.createElement('button');
      reject.className = 'message-action';
      reject.textContent = 'Reject';
      reject.onclick = () => resumeApproval(runId, false, div);

      actions.append(approve, reject);
      bubble.appendChild(actions);
      div.appendChild(bubble);
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    async function resumeApproval(runId, approved, card) {
      card.remove();
      showTyping();
      try {
        const res = await fetch(`/runs/${encodeURIComponent(runId)}/approve`, {
          method: 'POST',
          headers: await apiHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ approved })
        });
        const data = await res.json();
        hideTyping();
        addMessage(data.reply || data.detail || 'The run ended.', 'aria');
        if (data.approval_required) showApproval(data.run_id || runId, data.interruptions || []);
      } catch (err) {
        hideTyping();
        addMessage('Approval could not be completed.', 'aria');
      }
    }

    function updateTimestamp() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Lagos' });
      document.getElementById('timestamp').textContent = timeStr;
    }
    updateTimestamp();
    setInterval(updateTimestamp, 60000);

    function getUserInitials(displayName, email) {
      if (!displayName) return email.substring(0,2).toUpperCase();
      const parts = displayName.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
      return (parts[0][0] + (parts[1][0] || '')).toUpperCase();
    }

    // ── DOM refs ──
    const mainUI = document.getElementById('mainUI');
    const chatView = document.getElementById('chatView');
    const mainInput = document.getElementById('mainInput');
    const chatInput = document.getElementById('chatInput');
    const messagesArea = document.getElementById('messagesArea');
    const userNameSpan = document.getElementById('userName');
    const userInitialsSpan = document.getElementById('userInitials');
    const signoutBtn = document.getElementById('signoutBtn');
    const historyModal = document.getElementById('historyModal');
    const historyContent = document.getElementById('historyContent');
    const historyNewConversationBtn = document.getElementById('historyNewConversationBtn');
    const recentList = null;
    const recentSearch = null;
    const newConversationBtn = null;

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
    }
    function setupTextarea(inputEl) {
      if (!inputEl) return;
      inputEl.addEventListener('input', () => autoResize(inputEl));
      inputEl.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || event.shiftKey) return;
        event.preventDefault();
        sendFromInput(inputEl);
      });
      autoResize(inputEl);
    }
    setupTextarea(mainInput);
    setupTextarea(chatInput);

    // ── Get ARIA UID ──
    async function getAriaUid(email) {
      try {
        const res = await fetch(`/get-uid?email=${encodeURIComponent(email)}`, { headers: await apiHeaders() });
        const data = await res.json();
        if (data.aria_uid) {
          localStorage.setItem('aria_uid', data.aria_uid);
          return data.aria_uid;
        }
      } catch (e) {
        console.warn('Could not fetch ARIA UID:', e);
      }
      return null;
    }

    // ── Standalone conversation continuity ──
    function formatRecentTime(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const now = new Date();
      return d.toDateString() === now.toDateString()
        ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
        : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function renderRecentConversations() {
      if (!recentList) return;
      const q = recentSearchTerm.toLowerCase();
      const items = conversations.filter(item => !q || [item.title, item.preview].join(' ').toLowerCase().includes(q));
      recentList.innerHTML = '';
      if (!items.length) {
        recentList.innerHTML = '<div class="recent-empty">No previous chats yet.</div>';
        return;
      }
      items.forEach(item => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'recent-item' + (item.id === conversationId ? ' active' : '');
        const title = document.createElement('div');
        title.className = 'recent-item-title';
        title.textContent = item.title || 'New conversation';
        const preview = document.createElement('div');
        preview.className = 'recent-item-preview';
        preview.textContent = item.preview || 'No messages yet.';
        const time = document.createElement('div');
        time.className = 'recent-item-time';
        time.textContent = formatRecentTime(item.updated_at);
        button.append(title, preview, time);
        button.addEventListener('click', () => openConversation(item.id));
        recentList.appendChild(button);
      });
    }

    async function loadConversations() {
      if (!currentUser || !recentList) return;
      if (recentList) recentList.innerHTML = '<div class="recent-loading">Loading your conversations…</div>';
      try {
        const query = recentSearchTerm ? '&search=' + encodeURIComponent(recentSearchTerm) : '';
        const res = await fetch('/conversations?limit=100' + query, { headers: await apiHeaders(), cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        conversations = Array.isArray(data.conversations) ? data.conversations : [];
        renderRecentConversations();
      } catch (e) {
        console.warn('Conversations could not be loaded:', e);
        conversations = [];
        if (recentList) recentList.innerHTML = '<div class="recent-empty">Conversations could not be loaded.</div>';
      }
    }

    async function openConversation(id) {
      if (!id || !currentUser) return;
      try {
        const res = await fetch('/conversations/' + encodeURIComponent(id), { headers: await apiHeaders(), cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        conversationId = data.id || id;
        clearChatStarters();
        messagesArea.innerHTML = '';
        const messages = Array.isArray(data.messages) ? data.messages : [];
        messages.forEach(item => {
          if (item.role === 'user') addMessage(item.content, 'user');
          else if (item.role === 'assistant') addMessage(item.content, 'aria');
        });
        renderRecentConversations();
        if (!messages.length) {
          const name = localStorage.getItem('displayName') || currentUser.displayName || currentUser.email.split('@')[0];
          addMessage('Hey ' + name + '. I\'m ARIA. What would you like to explore?', 'aria');
          showChatStarters();
        }
        messagesArea.scrollTop = messagesArea.scrollHeight;
      } catch (e) {
        console.warn('Conversation could not be opened:', e);
        addMessage('I could not open that conversation right now.', 'aria');
      }
    }

    function clearChatStarters() {
      const existing = document.getElementById('chatStarters');
      if (existing) existing.remove();
    }

    function showChatStarters() {
      clearChatStarters();
      const starters = [
        'What do you remember about me?',
        'Help me plan my biggest goal',
        'What can you do for me?',
        'Help me find my next opportunity'
      ];
      const wrap = document.createElement('div');
      wrap.id = 'chatStarters';
      wrap.className = 'chat-starters';
      starters.forEach((prompt) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'chat-starter';
        button.textContent = prompt;
        button.addEventListener('click', () => sendToAria(prompt, chatInput));
        wrap.appendChild(button);
      });
      messagesArea.appendChild(wrap);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function startNewConversation() {
      conversationId = null;
      messagesArea.innerHTML = '';
      renderRecentConversations();
      const name = localStorage.getItem('displayName') || (currentUser && currentUser.displayName) || (currentUser && currentUser.email ? currentUser.email.split('@')[0] : 'friend');
      addMessage('Hey ' + name + '. I\'m ARIA. What would you like to explore?', 'aria');
      showChatStarters();
      chatInput.focus();
    }

    // ── Chat functions ──
    function addMessage(text, sender, showRating = false, msgId = null) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerHTML = safeMarkdown(text);
      div.appendChild(bubble);
      if (sender === 'aria') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        actions.innerHTML = `<button class="message-action copy-msg">📋 Copy</button><button class="message-action speak-msg">🔊 Speak</button>`;
        actions.querySelector('.copy-msg').onclick = () => navigator.clipboard.writeText(text);
        actions.querySelector('.speak-msg').onclick = () => {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          speechSynthesis.cancel();
          speechSynthesis.speak(utterance);
        };
        div.appendChild(actions);
        if (showRating) {
          const ratingDiv = document.createElement('div');
          ratingDiv.className = 'rating-row';
          ratingDiv.setAttribute('aria-label', 'Rate this ARIA response');
          for (let i = 1; i <= 5; i++) {
            const star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            star.setAttribute("class", "rating-star");
            star.setAttribute("viewBox", "0 0 24 24");
            star.setAttribute("role", "button");
            star.setAttribute("tabindex", "0");
            star.setAttribute("aria-label", 'Rate ' + i + ' out of 5');
            star.innerHTML = '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>';
            star.dataset.score = i;
            const submitRating = (e) => {
              e.stopPropagation();
              const score = parseInt(star.dataset.score, 10);
              sendRating(score, ratingDiv, msgId);
              const allStars = ratingDiv.querySelectorAll('.rating-star');
              allStars.forEach((item, idx) => {
                if (idx < score) item.classList.add('active');
                else item.classList.remove('active');
              });
            };
            star.onclick = submitRating;
            star.onkeydown = (e) => {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); submitRating(e); }
            };
            ratingDiv.appendChild(star);
          }
          div.appendChild(ratingDiv);
        }
      }
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      return div;
    }

    async function sendRating(score, ratingDiv, runId = null) {
      if (!currentUser) return;
      ratingDiv.textContent = 'Saving feedback…';
      try {
        const response = await fetch('/feedback', {
          method: 'POST',
          headers: await apiHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ score: score, run_id: runId || null })
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        ratingDiv.textContent = '✓ Feedback saved';
      } catch (e) {
        console.warn('Feedback could not be sent:', e);
        ratingDiv.textContent = 'Feedback could not be saved';
      }
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message aria';
      div.id = 'typingIndicator';
      div.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }
    function hideTyping() {
      const el = document.getElementById('typingIndicator');
      if (el) el.remove();
    }

    // ── SEND MESSAGE ──
    async function sendToAria(message, inputElement) {
      if (!currentUser || chatBusy) {
        if (!currentUser) addMessage("Please sign in first.", 'aria');
        return;
      }
      chatBusy = true;
      clearChatStarters();
      addMessage(message, 'user');
      inputElement.value = '';
      autoResize(inputElement);
      showTyping();

      try {
        const res = await authenticatedFetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            email: currentUser.email.toLowerCase(),
            conversation_id: conversationId
          })
        });
        const raw = await res.text();
        let data = {};
        try { data = JSON.parse(raw); } catch (_) {}
        if (!res.ok) {
          const detail = typeof data.detail === 'string' ? data.detail : `HTTP ${res.status}`;
          throw new Error(detail);
        }
        hideTyping();
        if (data.conversation_id) conversationId = data.conversation_id;
        if (data.error) addMessage(`Error: ${data.error}`, 'aria');
        else { addMessage(data.reply || '...', 'aria', true, data.run_id); if (data.approval_required) showApproval(data.run_id, data.interruptions || []); }
        renderRecentConversations();
        loadConversations();
      } catch(e) {
        hideTyping();
        console.error("Chat error:", e);
        const reason = e && e.message ? e.message : "The connection failed unexpectedly.";
        addMessage(`ARIA couldn't connect: ${reason}`, 'aria');
      } finally {
        chatBusy = false;
        chatInput.disabled = false;
        mainInput.disabled = false;
      }
    }

    function openChat() {
      mainUI.style.display = 'none';
      chatView.classList.add('active');
      if (currentUser) {
        loadConversations();
        if (conversationId && messagesArea.children.length === 0) openConversation(conversationId);
        else if (!conversationId && messagesArea.children.length === 0) startNewConversation();
      }
      chatInput.focus();
    }
    function closeChat() {
      mainUI.style.display = 'flex';
      chatView.classList.remove('active');
    }
    // ── History ──
    let historyItems = [];
    let historySearchTerm = '';

    function formatHistoryDate(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return 'Earlier';
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const diff = Math.round((today - target) / 86400000);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Yesterday';
      return date.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric', year: date.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
    }

    function formatHistoryTime(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    }

    function renderHistory(items) {
      historyContent.innerHTML = '';
      if (!items.length) {
        historyContent.innerHTML = '<div class="history-empty">No conversations match your search.</div>';
        return;
      }

      let lastGroup = null;
      items.forEach(item => {
        const group = formatHistoryDate(item.created_at);
        if (group !== lastGroup) {
          const day = document.createElement('div');
          day.className = 'history-day';
          day.textContent = group;
          historyContent.appendChild(day);
          lastGroup = group;
        }

        const card = document.createElement('section');
        card.className = 'history-item';

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'history-item-toggle';
        toggle.setAttribute('aria-expanded', 'false');

        const heading = document.createElement('div');
        heading.className = 'history-item-heading';

        const title = document.createElement('div');
        title.className = 'history-item-title';
        title.textContent = item.input || 'Untitled conversation';

        const side = document.createElement('div');
        side.className = 'history-item-side';

        const time = document.createElement('span');
        time.textContent = formatHistoryTime(item.created_at);

        const status = document.createElement('span');
        const statusText = String(item.status || 'saved');
        const failed = statusText.toLowerCase().includes('fail') || statusText.toLowerCase().includes('error');
        status.className = 'history-status' + (failed ? ' failed' : '');
        status.textContent = failed ? 'Needs attention' : (statusText.toLowerCase() === 'active' ? 'Saved' : statusText);

        const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        chevron.setAttribute('viewBox', '0 0 24 24');
        chevron.setAttribute('fill', 'none');
        chevron.setAttribute('stroke', 'currentColor');
        chevron.setAttribute('stroke-width', '1.8');
        chevron.setAttribute('stroke-linecap', 'round');
        chevron.setAttribute('stroke-linejoin', 'round');
        chevron.setAttribute('aria-hidden', 'true');
        chevron.classList.add('history-chevron');
        const chevronPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        chevronPath.setAttribute('d', 'm6 9 6 6 6-6');
        chevron.appendChild(chevronPath);

        side.append(time, status, chevron);
        heading.append(title, side);
        toggle.appendChild(heading);

        const preview = String(item.output || '').trim();
        if (preview) {
          const summary = document.createElement('div');
          summary.className = 'history-item-summary';
          summary.textContent = 'Latest activity: ' + preview.replace(/\s+/g, ' ').slice(0, 240);
          toggle.appendChild(summary);
        }

        const thread = document.createElement('div');
        thread.className = 'history-thread';
        thread.hidden = true;
        card.append(toggle, thread);

        toggle.addEventListener('click', async () => {
          const expanded = toggle.getAttribute('aria-expanded') !== 'true';
          toggle.setAttribute('aria-expanded', String(expanded));
          card.classList.toggle('expanded', expanded);
          thread.hidden = !expanded;
          if (!expanded || thread.dataset.loaded === '1' || thread.dataset.loading === '1') return;

          thread.dataset.loading = '1';
          thread.innerHTML = '<div class="history-thread-state">Loading this conversation…</div>';
          try {
            const res = await fetch('/conversations/' + encodeURIComponent(item.conversation_id), {
              headers: await apiHeaders(),
              cache: 'no-store'
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data && data.detail ? data.detail : 'HTTP ' + res.status);

            thread.innerHTML = '';
            const messages = Array.isArray(data.messages) ? data.messages : [];
            if (!messages.length) {
              thread.innerHTML = '<div class="history-thread-state">No messages were saved in this conversation.</div>';
            } else {
              messages.forEach(message => {
                const role = message.role === 'user' ? 'user' : 'aria';
                const row = document.createElement('article');
                row.className = 'history-message ' + role;

                const head = document.createElement('div');
                head.className = 'history-message-head';

                const label = document.createElement('span');
                label.className = 'history-message-label';
                label.textContent = role === 'user' ? 'You' : 'ARIA';
                const messageTime = document.createElement('span');
                messageTime.textContent = formatHistoryTime(message.created_at);
                head.append(label, messageTime);

                const body = document.createElement('div');
                body.className = 'history-message-content';
                body.innerHTML = safeMarkdown(String(message.content || ''));

                row.append(head, body);
                thread.appendChild(row);
              });
            }
            thread.dataset.loaded = '1';
          } catch (e) {
            console.warn('Conversation history detail could not be loaded:', e);
            thread.innerHTML = '<div class="history-thread-state">This conversation could not be loaded. Close and reopen it to try again.</div>';
            thread.dataset.loaded = '0';
          } finally {
            thread.dataset.loading = '0';
          }
        });

        historyContent.appendChild(card);
      });
    }

    let historyRequestId = 0;
    async function fetchHistory() {
      if (!currentUser) return;
      const requestId = ++historyRequestId;
      historyContent.innerHTML = '<div class="history-loading">Loading your conversations…</div>';
      try {
        const query = historySearchTerm ? '&search=' + encodeURIComponent(historySearchTerm) : '';
        const res = await fetch('/conversations?limit=200' + query, { headers: await apiHeaders(), cache: 'no-store' });
        if (requestId !== historyRequestId) return;
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (requestId !== historyRequestId) return;
        const items = Array.isArray(data.conversations) ? data.conversations : [];
        historyItems = items.map(item => ({
          conversation_id: item.id,
          input: item.title || 'Conversation',
          output: item.preview || '',
          status: item.status || 'saved',
          created_at: item.updated_at || item.created_at
        }));
        renderHistory(historyItems);
      } catch (e) {
        if (requestId !== historyRequestId) return;
        console.warn('History could not be loaded:', e);
        historyContent.innerHTML = '<div class="history-error">History could not be loaded right now. Please refresh to try again.</div>';
      }
    }
    function showHistory() {
      historySearchTerm = '';
      const search = document.getElementById('historySearch');
      if (search) search.value = '';
      historyModal.classList.add('active');
      fetchHistory();
    }

    function closeHistory() { historyModal.classList.remove('active'); }

    const historySearch = document.getElementById('historySearch');
    if (historySearch) {
      let historySearchTimer = null;
      historySearch.addEventListener('input', (e) => {
        historySearchTerm = e.target.value.trim();
        historyRequestId += 1;
        if (historySearchTimer) clearTimeout(historySearchTimer);
        historySearchTimer = setTimeout(() => fetchHistory(), 220);
      });
    }

    // ── Event listeners ──
    document.querySelectorAll('.feature-card').forEach(card => {
      card.addEventListener('click', () => {
        openChat();
        const pillar = card.querySelector('.card-title').textContent;
        addMessage(`Let's talk about ${pillar}. How can I help?`, 'aria');
      });
    });

    mainInput.addEventListener('focus', openChat);
    document.getElementById('closeChatBtn').addEventListener('click', closeChat);

    function sendFromInput(inputEl) {
      if (chatBusy) return;
      const msg = inputEl.value.trim();
      if (msg) sendToAria(msg, inputEl);
    }
    document.getElementById('chatSendBtn').addEventListener('click', () => sendFromInput(chatInput));
    document.getElementById('sendBtn').addEventListener('click', () => sendFromInput(mainInput));

    if (recentSearch) {
      recentSearch.addEventListener('input', (e) => {
        recentSearchTerm = e.target.value.trim();
        loadConversations();
      });
    }
    if (newConversationBtn) newConversationBtn.addEventListener('click', startNewConversation);

    document.getElementById('historyBtn').addEventListener('click', showHistory);
    document.getElementById('closeHistoryBtn').addEventListener('click', closeHistory);
    document.getElementById('historyRefreshBtn').addEventListener('click', fetchHistory);
    if (historyNewConversationBtn) historyNewConversationBtn.addEventListener('click', () => {
      closeHistory();
      mainUI.style.display = 'none';
      chatView.classList.add('active');
      startNewConversation();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && historyModal.classList.contains('active')) closeHistory();
    });
    historyModal.addEventListener('click', (e) => { if (e.target === historyModal) closeHistory(); });

    signoutBtn.addEventListener('click', async () => {
      try {
        await auth.signOut();
        window.location.href = '/login.html';
      } catch(e) { console.error(e); }
    });

    // ── Upload ──
    async function uploadFile(file, uid) {
      if (file.size > 25 * 1024 * 1024) {
        addMessage("❌ File too large. Max 25MB.", 'aria');
        return;
      }
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        const fileType = file.type.includes('pdf') ? 'pdf' : 'image';
        const endpoint = fileType === 'image' ? '/upload-ocr' : '/upload-pdf';
        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: await apiHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({
              email: currentUser.email,
              file_base64: base64,
              file_name: file.name,
              file_type: fileType,
              mime_type: file.type
            })
          });
          const text = await res.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (e) {
            addMessage("Server error: invalid response", 'aria');
            return;
          }
          if (data.status === 'uploaded' && fileType === 'image') {
            addMessage(`Uploaded "${file.name}" to ARIA's private workspace. Vision/OCR can run through a connected worker.`, 'aria');
          } else if (data.status === 'uploaded' && fileType === 'pdf') {
            addMessage(`PDF "${file.name}" stored. Extracted ${data.full_length} characters.`, 'aria');
          } else if (data.status === 'OCR completed') {
            addMessage(`📄 OCR completed for "${file.name}". Extracted ${data.full_length} characters. Preview: ${data.text.substring(0, 100)}...`, 'aria');
          } else if (data.status === 'PDF processed') {
            addMessage(`📄 PDF processed for "${file.name}". Extracted ${data.full_length} characters. Preview: ${data.text.substring(0, 100)}...`, 'aria');
          } else if (data.status === 'Upload received (debug)') {
            addMessage(`📄 Uploaded "${file.name}" (metadata only). OCR not applied.`, 'aria');
          } else {
            addMessage(`Upload failed: ${data.error || 'Unknown'}`, 'aria');
          }
        } catch (err) {
          addMessage(`Upload error: ${err.message}`, 'aria');
        }
      };
      reader.readAsDataURL(file);
    }

    function triggerUpload(uid) {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,application/pdf';
      input.onchange = (e) => {
        if (e.target.files.length) uploadFile(e.target.files[0], uid);
      };
      input.click();
    }

    const uploadBtn = document.getElementById('uploadBtn');
    const chatUploadBtn = document.getElementById('chatUploadBtn');
    if (uploadBtn) {
      uploadBtn.onclick = () => {
        if (currentUser && currentUser.uid) triggerUpload(currentUser.uid);
        else addMessage("Please sign in first.", 'aria');
      };
    }
    if (chatUploadBtn) {
      chatUploadBtn.onclick = () => {
        if (currentUser && currentUser.uid) triggerUpload(currentUser.uid);
        else addMessage("Please sign in first.", 'aria');
      };
    }

    // ── Auth ──
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        firebaseIdToken = await user.getIdToken();
        loadConversations();
        setInterval(() => {
          fetch('/health').catch(() => {});
        }, 4 * 60 * 1000);
        const displayName = user.displayName || user.email.split('@')[0];
        userNameSpan.textContent = displayName;
        localStorage.setItem('displayName', displayName);
        const initials = getUserInitials(user.displayName, user.email);
        userInitialsSpan.textContent = initials;
        
        const ariaUid = await getAriaUid(user.email);
        if (ariaUid) {
          localStorage.setItem('aria_uid', ariaUid);
          console.log('[Auth] ARIA UID:', ariaUid);
          try {
            await fetch('/set_user_name', {
              method: 'POST',
              headers: await apiHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({ email: user.email.toLowerCase(), name: displayName })
            });
          } catch(e) { console.warn('Name save error:', e); }
        }
      } else {
        window.location.href = '/login.html';
      }
    });

    setTimeout(() => {
      if (currentUser && userNameSpan.textContent === 'friend') {
        const displayName = localStorage.getItem('displayName') || currentUser.displayName || currentUser.email.split('@')[0];
        userNameSpan.textContent = displayName;
      }
    }, 500);
  </script>
</body>
</html>
