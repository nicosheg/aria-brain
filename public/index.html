<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARIA — Personal Intelligence System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0A0A12;
      color: #E8EDF2;
      height: 100vh;
      overflow: hidden;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* Deep cosmic background */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 40% 50%, #0F0F1A 0%, #05050A 100%);
      z-index: -2;
    }

    /* Starfield canvas - ultra subtle */
    #starCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      opacity: 0.7;
    }

    /* Subtle nebula breath */
    .nebula-breath {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 50%, rgba(167, 139, 250, 0.03) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: breath 24s infinite alternate;
    }

    @keyframes breath {
      0% { opacity: 0.3; transform: scale(1); }
      100% { opacity: 0.8; transform: scale(1.05); }
    }

    /* Main container */
    .aria-container {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: transparent;
    }

    /* Header - minimal */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 24px 24px 8px;
      flex-shrink: 0;
    }

    .mark {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7A8AA4;
      font-weight: 400;
    }

    .user-context {
      font-size: 12px;
      color: #A78BFA;
      opacity: 0.7;
      background: transparent;
    }

    /* Main scroll area */
    .intelligence-layer {
      flex: 1;
      overflow-y: auto;
      padding: 8px 24px 24px;
      scrollbar-width: thin;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .intelligence-layer::-webkit-scrollbar {
      width: 3px;
    }
    .intelligence-layer::-webkit-scrollbar-thumb {
      background: #2A2A3A;
      border-radius: 3px;
    }

    /* Hero greeting - focus, not cards */
    .hero-greeting {
      animation: fadeUp 0.7s ease;
    }

    .greeting-line {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .greeting-line span {
      color: #A78BFA;
      font-weight: 500;
    }

    .status-summary {
      font-size: 15px;
      color: #9AA6BB;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .focus-question {
      font-size: 17px;
      color: #C0C8D6;
      margin-top: 20px;
      font-weight: 400;
      border-left: 2px solid rgba(167, 139, 250, 0.4);
      padding-left: 14px;
    }

    /* Portal cards - small, inviting */
    .portals {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .portal {
      background: rgba(255, 255, 255, 0.02);
      border: 0.5px solid rgba(255, 255, 255, 0.06);
      border-radius: 80px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 400;
      color: #BCC6D4;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
    }

    .portal:hover {
      background: rgba(167, 139, 250, 0.1);
      border-color: rgba(167, 139, 250, 0.3);
      color: #E8EDF2;
      transform: translateY(-1px);
    }

    /* Memory nodes (future stars) */
    .memory-traces {
      margin-top: 20px;
      font-size: 11px;
      color: #5A6A86;
      letter-spacing: 0.3px;
      border-top: 0.5px solid rgba(255,255,255,0.05);
      padding-top: 20px;
    }

    /* Input area - connection point */
    .input-connection {
      padding: 12px 24px 24px;
      flex-shrink: 0;
      background: transparent;
    }

    .connection-field {
      background: rgba(20, 22, 36, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 44px;
      padding: 8px 8px 8px 22px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .connection-field:focus-within {
      border-color: rgba(167, 139, 250, 0.3);
    }

    .input-icon {
      font-size: 18px;
      opacity: 0.5;
    }

    #intentInput {
      flex: 1;
      background: transparent;
      border: none;
      color: #E8EDF2;
      font-family: inherit;
      font-size: 15px;
      font-weight: 400;
      resize: none;
      outline: none;
      min-height: 46px;
      line-height: 1.4;
    }

    #intentInput::placeholder {
      color: #5A6A86;
      font-weight: 300;
    }

    .send-connection {
      background: rgba(167, 139, 250, 0.5);
      border: none;
      border-radius: 40px;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .send-connection:hover {
      background: #A78BFA;
    }

    /* Chat view - minimal, disappears */
    .chat-layer {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .chat-layer.active {
      display: flex;
    }

    .chat-header {
      padding: 20px 24px 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 0.5px solid rgba(255,255,255,0.05);
    }

    .chat-back {
      background: rgba(255,255,255,0.05);
      width: 32px;
      height: 32px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 85%;
      animation: fadeUp 0.3s ease;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.aria {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 10px 16px;
      border-radius: 22px;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
    }

    .user .message-bubble {
      background: rgba(167, 139, 250, 0.2);
      border: 0.5px solid rgba(167, 139, 250, 0.2);
      border-bottom-right-radius: 6px;
    }

    .aria .message-bubble {
      background: rgba(255, 255, 255, 0.04);
      border: 0.5px solid rgba(255, 255, 255, 0.06);
      border-bottom-left-radius: 6px;
    }

    .message-time {
      font-size: 9px;
      color: #5A6A86;
      margin-top: 5px;
      padding: 0 6px;
    }

    .typing-thought {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    .typing-dot {
      width: 5px;
      height: 5px;
      background: #A78BFA;
      border-radius: 50%;
      opacity: 0.4;
      animation: pulseDot 1.4s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 0.2; transform: scale(0.8);}
      50% { opacity: 0.8; transform: scale(1);}
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Login overlay - minimal */
    .login-universe {
      position: fixed;
      inset: 0;
      background: #05050A;
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .login-portal {
      text-align: center;
      padding: 32px;
    }

    .login-portal .brand {
      font-size: 36px;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .google-connect {
      background: rgba(255,255,255,0.05);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 44px;
      padding: 12px 28px;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>

<div class="cosmic-bg"></div>
<canvas id="starCanvas"></canvas>
<div class="nebula-breath"></div>

<div id="loginOverlay" class="login-universe">
  <div class="login-portal">
    <div class="brand">ARIA</div>
    <button class="google-connect" id="googleSigninBtn">
      <span>🔗</span> connect with Google
    </button>
  </div>
</div>

<div id="ariaApp" style="display: none;">
<div class="aria-container">
  <div class="header">
    <div class="mark">PERSONAL INTELLIGENCE SYSTEM</div>
    <div class="user-context" id="userIdentity"></div>
  </div>

  <!-- Home intelligence layer -->
  <div id="homeLayer" class="intelligence-layer">
    <div class="hero-greeting">
      <div class="greeting-line" id="greetingText">Good evening, <span>Nicholas</span>.</div>
      <div class="status-summary" id="statusSummary">loading your universe...</div>
      <div class="focus-question">What would you like to explore today?</div>
    </div>

    <div class="portals">
      <div class="portal" data-pillar="Memory">🧠 Memory</div>
      <div class="portal" data-pillar="Education">📖 Education</div>
      <div class="portal" data-pillar="Income">💰 Income</div>
      <div class="portal" data-pillar="Decisions">⚖️ Decisions</div>
    </div>

    <div class="memory-traces" id="memoryTraces">
      ✦ memory constellation forming ✦
    </div>
  </div>

  <!-- Chat layer (appears when needed) -->
  <div id="chatLayer" class="chat-layer">
    <div class="chat-header">
      <div class="chat-back" id="closeChatBtn">←</div>
      <div style="font-size: 13px; opacity:0.7;">intelligence stream</div>
    </div>
    <div class="messages-area" id="messagesArea"></div>
    <div class="input-connection">
      <div class="connection-field">
        <span class="input-icon">✦</span>
        <textarea id="chatIntent" rows="1" placeholder="What's on your mind?"></textarea>
        <button class="send-connection" id="sendChatBtn">→</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
    authDomain: "fiducia-148b9.firebaseapp.com",
    projectId: "fiducia-148b9",
    storageBucket: "fiducia-148b9.firebasestorage.app",
    messagingSenderId: "380888909038",
    appId: "1:380888909038:web:efe40c252537e670959fff"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let currentUser = null;
  let typingDiv = null;

  // DOM elements
  const loginOverlay = document.getElementById('loginOverlay');
  const ariaApp = document.getElementById('ariaApp');
  const homeLayer = document.getElementById('homeLayer');
  const chatLayer = document.getElementById('chatLayer');
  const messagesArea = document.getElementById('messagesArea');
  const chatIntent = document.getElementById('chatIntent');
  const userIdentitySpan = document.getElementById('userIdentity');

  function updateGreeting(name) {
    const hour = new Date().getHours();
    let greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greetingText').innerHTML = `${greeting}, <span>${name}</span>.`;
    document.getElementById('statusSummary').innerHTML = `Your memory is intact. 3 learning journeys active · 2 emerging opportunities`;
    userIdentitySpan.textContent = name;
  }

  function showTyping() {
    if (typingDiv) return;
    typingDiv = document.createElement('div');
    typingDiv.className = 'message aria';
    typingDiv.innerHTML = `<div class="message-bubble"><div class="typing-thought"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
    messagesArea.appendChild(typingDiv);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }

  function hideTyping() {
    if (typingDiv) { typingDiv.remove(); typingDiv = null; }
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    if (sender === 'aria') bubble.innerHTML = marked.parse(text);
    else bubble.textContent = text;
    const timeDiv = document.createElement('div');
    timeDiv.className = 'message-time';
    timeDiv.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    div.appendChild(bubble);
    div.appendChild(timeDiv);
    messagesArea.appendChild(div);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return div;
  }

  async function sendToAria(messageText) {
    if (!currentUser) return;
    showTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: messageText,
          user_id: currentUser.uid,
          email: currentUser.email.toLowerCase()
        })
      });
      const data = await res.json();
      hideTyping();
      if (data.error) addMessage(`error: ${data.error}`, 'aria');
      else addMessage(data.reply || '…', 'aria');
    } catch(e) {
      hideTyping();
      addMessage(`connection uncertain: ${e.message}`, 'aria');
    }
  }

  async function sendMessage() {
    const msg = chatIntent.value.trim();
    if (!msg) return;
    addMessage(msg, 'user');
    chatIntent.value = '';
    chatIntent.style.height = 'auto';
    await sendToAria(msg);
  }

  function openChatWithContext(context) {
    homeLayer.style.display = 'none';
    chatLayer.classList.add('active');
    messagesArea.innerHTML = '';
    addMessage(`I'm here, ${currentUser?.displayName?.split(' ')[0] || 'friend'}.`, 'aria');
    addMessage(`You wanted to explore ${context}. What would you like to know?`, 'aria');
    chatIntent.focus();
  }

  function closeChat() {
    homeLayer.style.display = 'flex';
    chatLayer.classList.remove('active');
    messagesArea.innerHTML = '';
  }

  // Portal click handlers
  document.querySelectorAll('.portal').forEach(el => {
    el.addEventListener('click', () => openChatWithContext(el.textContent.trim()));
  });
  document.getElementById('closeChatBtn').onclick = closeChat;
  document.getElementById('sendChatBtn').onclick = sendMessage;
  chatIntent.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  chatIntent.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  // Auth
  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      const name = user.displayName || user.email.split('@')[0];
      await fetch('/set_user_name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: user.uid,
          email: user.email.toLowerCase(),
          name: name
        })
      }).catch(e=>console.log);
      loginOverlay.style.display = 'none';
      ariaApp.style.display = 'block';
      updateGreeting(name);
    } else {
      loginOverlay.style.display = 'flex';
      ariaApp.style.display = 'none';
    }
  });

  document.getElementById('googleSigninBtn').onclick = () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider);
  };

  // Starfield – ultra subtle
  const canvas = document.getElementById('starCanvas');
  const ctxCanvas = canvas.getContext('2d');
  let stars = [];
  let starTime = 0;

  function resizeStars() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = [];
    const starCount = Math.floor((canvas.width * canvas.height) / 7000);
    for (let i = 0; i < starCount; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.2 + 0.3,
        alpha: Math.random() * 0.5 + 0.1,
        driftX: (Math.random() - 0.5) * 0.2,
        driftY: (Math.random() - 0.5) * 0.2,
        speed: 0.002 + Math.random() * 0.005
      });
    }
  }

  function drawStars() {
    if (!ctxCanvas) return;
    ctxCanvas.clearRect(0, 0, canvas.width, canvas.height);
    ctxCanvas.fillStyle = 'transparent';
    ctxCanvas.fillRect(0, 0, canvas.width, canvas.height);
    starTime += 0.01;
    for (let s of stars) {
      let x = s.x + Math.sin(starTime * s.speed) * 0.5;
      let y = s.y + Math.cos(starTime * s.speed * 0.7) * 0.3;
      let twinkle = 0.5 + 0.5 * Math.sin(starTime * s.speed + s.alpha * 10);
      ctxCanvas.beginPath();
      ctxCanvas.arc(x, y, s.radius, 0, Math.PI*2);
      ctxCanvas.fillStyle = `rgba(255, 245, 240, ${s.alpha * (0.6 + twinkle * 0.4)})`;
      ctxCanvas.fill();
    }
    requestAnimationFrame(drawStars);
  }

  window.addEventListener('resize', () => { resizeStars(); });
  resizeStars();
  drawStars();
</script>
</body>
</html>
