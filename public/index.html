<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ARIA — Personal Intelligence System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #03050A;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .cosmic-bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 30% 40%, #0B1120 0%, #03050A 100%); z-index: 0; }
    .milky-way {
      position: fixed; top: -20%; left: -10%; width: 140%; height: 140%;
      background: radial-gradient(ellipse at 35% 35%, rgba(80,70,150,0.25) 0%, rgba(100,80,180,0.15) 20%, rgba(60,50,120,0.08) 50%, transparent 80%);
      transform: rotate(32deg); pointer-events: none; z-index: 0; filter: blur(45px);
    }
    .starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute; background: white; border-radius: 50%; opacity: 0;
      animation: slowTwinkle linear infinite;
    }
    @keyframes slowTwinkle { 0% { opacity: 0; transform: scale(0.6); } 20% { opacity: 0.6; transform: scale(1); } 80% { opacity: 0.6; } 100% { opacity: 0; transform: scale(0.6); } }
    .shooting-star {
      position: absolute; width: 1.5px; height: 1.5px; background: rgba(255,255,240,0.5); box-shadow: 0 0 4px rgba(255,255,200,0.4);
      border-radius: 50%; opacity: 0;
      animation: shootVerySlow 25s linear infinite;
    }
    @keyframes shootVerySlow {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 0.6; }
      30% { transform: translate(-120px, 120px); opacity: 0.2; }
      100% { transform: translate(-300px, 300px); opacity: 0; }
    }
    .nebula-dust { position: fixed; top: -120px; left: -120px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(90,70,160,0.08) 0%, transparent 70%); pointer-events: none; z-index: 0; filter: blur(80px); }

    .app-container {
      position: relative; z-index: 2; max-width: 620px; margin: 0 auto; min-height: 100vh;
      display: flex; flex-direction: column; background: transparent; padding: 20px 24px 16px;
    }
    .header { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 28px; }
    .user-signout {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 0.5px solid rgba(255,255,255,0.08);
      border-radius: 40px;
      padding: 6px 14px 4px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .user-signout:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
    }
    .user-initials {
      font-size: 14px;
      font-weight: 500;
      color: #E2E8F0;
      letter-spacing: 0.5px;
    }
    .signout-text {
      font-size: 8px;
      font-weight: 400;
      color: #7A8AAA;
      margin-top: 2px;
    }

    /* Centered welcome message – elegant, no card */
    .welcome-center {
      text-align: center;
      margin: 20px 0 28px;
      animation: fadeInUp 0.8s ease;
    }
    .greeting-main {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: -0.3px;
      color: #F0F4FA;
      line-height: 1.3;
    }
    .greeting-main span {
      font-weight: 500;
      color: #A78BFA;
    }
    .timestamp-center {
      font-size: 11px;
      color: #7A8AAA;
      margin-top: 8px;
      font-weight: 300;
      opacity: 0.7;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tiny, unobtrusive cards */
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 6px; }
    .feature-card {
      background: rgba(18,25,45,0.2); backdrop-filter: blur(4px); border-radius: 14px;
      padding: 5px 4px 4px; display: flex; flex-direction: column;
      border: 0.5px solid rgba(255,255,255,0.02);
    }
    .card-icon {
      width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
      margin-bottom: 3px;
    }
    .card-memory .card-icon { background: rgba(167,139,250,0.08); }
    .card-education .card-icon { background: rgba(96,165,250,0.08); }
    .card-income .card-icon { background: rgba(16,185,129,0.08); }
    .card-icon svg { width: 10px; height: 10px; fill: none; stroke-width: 1.5; }
    .card-memory .card-icon svg { stroke: #A78BFA; }
    .card-education .card-icon svg { stroke: #60A5FA; }
    .card-income .card-icon svg { stroke: #10B981; }
    .card-title { font-size: 8px; font-weight: 500; color: #C5D0E6; margin-bottom: 1px; letter-spacing: 0.2px; }
    .card-desc { font-size: 6px; color: #7A8AAA; line-height: 1.2; margin-bottom: 4px; opacity: 0.6; }
    .card-arrow { align-self: flex-end; margin-top: auto; opacity: 0.2; }
    .card-arrow svg { width: 5px; height: 5px; stroke: #9CA3AF; }

    .divider { text-align: center; margin: 24px 0 8px; }
    .divider-text { font-size: 8px; letter-spacing: 1.2px; color: #60A5FA; display: inline-flex; align-items: center; gap: 6px; opacity: 0.5; }

    .spacer { flex: 1; min-height: 30px; }

    .input-capsule {
      background: #0A0F1A; border: 1px solid #3B82F6; border-radius: 50px; padding: 6px 12px 6px 18px;
      display: flex; align-items: center; gap: 8px; margin: 8px 0 12px; box-shadow: 0 0 6px rgba(59,130,246,0.1);
    }
    .input-icon-left svg { width: 14px; height: 14px; stroke: #60A5FA; }
    .input-field {
      flex: 1; background: transparent; border: none; color: white; font-size: 13px; outline: none; padding: 6px 0;
    }
    .input-field::placeholder { color: #334155; font-weight: 400; }
    .send-circle {
      width: 30px; height: 30px; background: transparent; border: 1px solid #1E40AF; border-radius: 30px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .send-circle svg { width: 12px; height: 12px; stroke: #3B82F6; stroke-width: 2; }

    .footer-note {
      text-align: center; padding: 6px 0 20px; font-size: 10px; letter-spacing: 0.6px;
      color: #4A5A7A; border-top: 0.5px solid rgba(255,255,255,0.04);
    }

    /* Chat overlay */
    .chat-view {
      position: fixed; inset: 0; background: #03050A; z-index: 100; padding: 20px;
      display: none; flex-direction: column;
    }
    .chat-view.active { display: flex; }
    .chat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back-btn { background: transparent; border: none; color: white; font-size: 26px; cursor: pointer; }
    .chat-actions { display: flex; gap: 12px; }
    .chat-action { background: transparent; border: none; font-size: 18px; cursor: pointer; filter: drop-shadow(0 0 3px currentColor); }
    .chat-action.copy { color: #60A5FA; }
    .chat-action.speak { color: #A78BFA; }
    .messages-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
    .message { max-width: 80%; animation: fadeUp 0.2s ease; }
    .message.user { align-self: flex-end; }
    .message.aria { align-self: flex-start; }
    .message-bubble { padding: 10px 14px; border-radius: 20px; font-size: 14px; background: rgba(255,255,255,0.05); color: white; }
    .message.user .message-bubble { background: rgba(96,165,250,0.15); border: 0.5px solid rgba(96,165,250,0.3); }
    .message-actions { display: flex; gap: 10px; margin-top: 6px; opacity: 0; transition: 0.2s; }
    .message:hover .message-actions { opacity: 0.7; }
    .message-action { background: transparent; border: none; font-size: 12px; cursor: pointer; color: #9CA3AF; }
    .message-action:hover { color: #60A5FA; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      .app-container { padding: 16px 16px 12px; }
      .spacer { min-height: 20px; }
      .divider { margin: 16px 0 6px; }
      .greeting-main { font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="milky-way"></div>
<div class="nebula-dust"></div>
<div class="starfield" id="starfield"></div>

<div class="app-container" id="mainUI">
  <div class="header">
    <div class="user-signout" id="signoutBtn">
      <div class="user-initials" id="userInitials">EN</div>
      <div class="signout-text">sign out</div>
    </div>
  </div>

  <!-- Centered welcome message (no card, no icon) -->
  <div class="welcome-center">
    <div class="greeting-main">Good evening, <span id="userNameDisplay">friend</span>.</div>
    <div class="timestamp-center" id="timestamp">—</div>
  </div>

  <div class="cards-grid">
    <div class="feature-card card-memory" data-pillar="Memory">
      <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2a9 9 0 1 0 0 18A9 9 0 0 0 12 2z"/><path d="M8 12s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg></div>
      <div class="card-title">Memory</div>
      <div class="card-desc">Your memories, organized.</div>
      <div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
    <div class="feature-card card-education" data-pillar="Education">
      <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
      <div class="card-title">Education</div>
      <div class="card-desc">Learn, grow, and master.</div>
      <div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
    <div class="feature-card card-income" data-pillar="Income">
      <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div class="card-title">Income</div>
      <div class="card-desc">Track, plan, and grow.</div>
      <div class="card-arrow"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></div>
    </div>
  </div>

  <div class="divider">
    <div class="divider-text">💫 ONE AI. EVERY PART OF YOUR LIFE. 💫</div>
  </div>

  <div class="spacer"></div>

  <div class="input-capsule">
    <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <input type="text" class="input-field" id="mainInput" placeholder="Chat Aria...">
    <div class="send-circle" id="sendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>
  <div class="footer-note">By MrNicosh Eg</div>
</div>

<!-- Part 1 ends here. Part 2 begins with chat overlay and JavaScript. -->
  <div id="chatView" class="chat-view">
  <div class="chat-header">
    <button class="back-btn" id="closeChatBtn">←</button>
    <div class="chat-actions">
      <button class="chat-action copy" id="copyLastMsgBtn" title="Copy last response">📋</button>
      <button class="chat-action speak" id="speakLastMsgBtn" title="Speak last response">🔊</button>
    </div>
  </div>
  <div class="messages-area" id="messagesArea"></div>
  <div class="input-capsule" style="margin-bottom: 0;">
    <div class="input-icon-left"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
    <input type="text" class="input-field" id="chatInput" placeholder="Chat Aria...">
    <div class="send-circle" id="chatSendBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
    authDomain: "fiducia-148b9.firebaseapp.com",
    projectId: "fiducia-148b9",
    storageBucket: "fiducia-148b9.firebasestorage.app",
    messagingSenderId: "380888909038",
    appId: "1:380888909038:web:efe40c252537e670959fff"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  let currentUser = null;
  let lastAriaMessage = null;

  function updateTimestamp() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Lagos' });
    const el = document.getElementById('timestamp');
    if (el) el.textContent = timeStr;
  }
  updateTimestamp();
  setInterval(updateTimestamp, 60000);

  const starfield = document.getElementById('starfield');
  function isNearDiagonal(x, y) { return (x + y) > 1.2; }
  for (let i = 0; i < 380; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    let x = Math.random();
    let y = Math.random();
    if (isNearDiagonal(x, y)) {
      star.style.left = (x * 100) + '%';
      star.style.top = (y * 100) + '%';
      star.style.width = (Math.random() * 1.5 + 0.3) + 'px';
      star.style.height = star.style.width;
      star.style.animationDuration = (Math.random() * 12 + 8) + 's';
    } else {
      if (Math.random() > 0.7) continue;
      star.style.left = (x * 100) + '%';
      star.style.top = (y * 100) + '%';
      star.style.width = (Math.random() * 1.0 + 0.2) + 'px';
      star.style.height = star.style.width;
      star.style.animationDuration = (Math.random() * 14 + 10) + 's';
    }
    star.style.animationDelay = (Math.random() * 12) + 's';
    starfield.appendChild(star);
  }
  for (let i = 0; i < 3; i++) {
    const shoot = document.createElement('div');
    shoot.className = 'shooting-star';
    shoot.style.left = (Math.random() * 70 + 15) + '%';
    shoot.style.top = (Math.random() * 50) + '%';
    shoot.style.animationDelay = (Math.random() * 40) + 's';
    starfield.appendChild(shoot);
  }

  const mainUI = document.getElementById('mainUI');
  const chatView = document.getElementById('chatView');
  const mainInput = document.getElementById('mainInput');
  const chatInput = document.getElementById('chatInput');
  const messagesArea = document.getElementById('messagesArea');
  const userNameSpan = document.getElementById('userNameDisplay');
  const userInitialsSpan = document.getElementById('userInitials');

  function abbreviateName(fullName) {
    if (!fullName) return 'EN';
    const parts = fullName.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
    return (parts[0][0] + (parts[1][0] || '')).toUpperCase();
  }

  async function loadHistory(ariaUid) {
    try {
      const res = await fetch(`/context?uid=${ariaUid}`);
      const data = await res.json();
      if (data.context) {
        const lines = data.context.split('\n');
        let current = null;
        for (let line of lines) {
          if (line.startsWith('User:')) {
            if (current) addMessage(current.trim(), 'aria');
            current = null;
            addMessage(line.substring(5).trim(), 'user');
          } else if (line.startsWith('ARIA:')) {
            current = line.substring(5).trim();
          }
        }
        if (current) addMessage(current.trim(), 'aria');
      }
    } catch(e) { console.warn('History load failed', e); }
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.innerHTML = marked.parse(text);
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    if (sender === 'aria') {
      actions.innerHTML = `<button class="message-action copy-msg">📋 Copy</button><button class="message-action speak-msg">🔊 Speak</button>`;
      actions.querySelector('.copy-msg').onclick = () => navigator.clipboard.writeText(text);
      actions.querySelector('.speak-msg').onclick = () => { const utterance = new SpeechSynthesisUtterance(text); utterance.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(utterance); };
    }
    div.appendChild(bubble);
    if (sender === 'aria') div.appendChild(actions);
    messagesArea.appendChild(div);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    if (sender === 'aria') lastAriaMessage = text;
    return div;
  }

  function addTyping() { const div = document.createElement('div'); div.className = 'message aria'; div.id = 'typingIndicator'; div.innerHTML = `<div class="message-bubble">✦ ✦ ✦</div>`; messagesArea.appendChild(div); messagesArea.scrollTop = messagesArea.scrollHeight; }
  function removeTyping() { const t = document.getElementById('typingIndicator'); if (t) t.remove(); }

  async function sendToAria(message, inputElement) {
    if (!currentUser) return;
    addMessage(message, 'user');
    inputElement.value = '';
    addTyping();
    try {
      const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: message, user_id: currentUser.uid, email: currentUser.email.toLowerCase() }) });
      const data = await res.json();
      removeTyping();
      if (data.error) addMessage(`Error: ${data.error}`, 'aria');
      else addMessage(data.reply || '...', 'aria');
    } catch(e) { removeTyping(); addMessage('Connection uncertain. Please try again.', 'aria'); }
  }

  function openChat() { mainUI.style.display = 'none'; chatView.classList.add('active'); if (messagesArea.children.length === 0 && currentUser) { addMessage(`Hey ${abbreviateName(currentUser.displayName || currentUser.email.split('@')[0])}. I'm ARIA. What would you like to explore?`, 'aria'); } chatInput.focus(); }
  function closeChat() { mainUI.style.display = 'flex'; chatView.classList.remove('active'); }

  async function signOut() { try { await auth.signOut(); window.location.href = '/login.html'; } catch(e) { console.error('Sign out error', e); } }

  mainInput.addEventListener('focus', openChat);
  document.querySelectorAll('.feature-card').forEach(card => { card.addEventListener('click', () => { openChat(); addMessage(`Let's talk about ${card.querySelector('.card-title').textContent}. How can I help?`, 'aria'); }); });
  document.getElementById('closeChatBtn').addEventListener('click', closeChat);
  document.getElementById('chatSendBtn').addEventListener('click', () => { const msg = chatInput.value.trim(); if (msg) sendToAria(msg, chatInput); });
  chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); const msg = chatInput.value.trim(); if (msg) sendToAria(msg, chatInput); } });
  document.getElementById('sendBtn').addEventListener('click', () => { const msg = mainInput.value.trim(); if (msg) sendToAria(msg, mainInput); });
  mainInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); const msg = mainInput.value.trim(); if (msg) sendToAria(msg, mainInput); } });
  document.getElementById('copyLastMsgBtn').addEventListener('click', () => { if (lastAriaMessage) navigator.clipboard.writeText(lastAriaMessage); });
  document.getElementById('speakLastMsgBtn').addEventListener('click', () => { if (lastAriaMessage) { const utterance = new SpeechSynthesisUtterance(lastAriaMessage); utterance.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(utterance); } });
  document.getElementById('signoutBtn').addEventListener('click', signOut);

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      const displayName = user.displayName || user.email.split('@')[0];
      const shortName = abbreviateName(displayName);
      userNameSpan.textContent = displayName;
      userInitialsSpan.textContent = shortName;
      try {
        await fetch('/set_user_name', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: user.uid, email: user.email.toLowerCase(), name: displayName }) });
        const uidRes = await fetch('/check_user?email=' + encodeURIComponent(user.email.toLowerCase()));
        const uidData = await uidRes.json();
        if (uidData.aria_uid) loadHistory(uidData.aria_uid);
      } catch(e) { console.warn(e); }
    } else { window.location.href = '/login.html'; }
  });
</script>
</body>
</html>
