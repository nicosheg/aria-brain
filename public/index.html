<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>ARIA — Personal Intelligence System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #03050A;
      font-family: 'Inter', sans-serif;
      color: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Cosmic layers */
    .cosmic-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, #0B1120 0%, #03050A 100%);
      z-index: 0;
    }
    .milky-way {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 140%;
      height: 140%;
      background: radial-gradient(ellipse at 35% 35%, 
        rgba(80, 70, 150, 0.25) 0%,
        rgba(100, 80, 180, 0.15) 20%,
        rgba(60, 50, 120, 0.08) 50%,
        transparent 80%);
      transform: rotate(32deg);
      pointer-events: none;
      z-index: 0;
      filter: blur(45px);
    }
    .nebula-dust {
      position: fixed;
      top: -120px;
      left: -120px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(90, 70, 160, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }
    .star-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    /* Main layout – bottom block sticks to bottom */
    .app-container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 24px;
      background: transparent;
    }
    /* Header (sign out) */
    .header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 28px;
    }
    .user-signout {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 40px;
      padding: 6px 14px 4px;
      cursor: pointer;
    }
    .user-signout:hover {
      background: rgba(255,255,255,0.06);
    }
    .user-initials {
      font-size: 13px;
      font-weight: 500;
      color: #E2E8F0;
    }
    .signout-label {
      font-size: 7px;
      color: #7A8AAA;
      margin-top: 1px;
    }
    /* Centered welcome message */
    .center-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .greeting {
      font-size: 24px;
      font-weight: 300;
      letter-spacing: -0.3px;
      color: #F0F4FA;
    }
    .greeting span {
      font-weight: 500;
      color: #A78BFA;
    }
    .timestamp {
      font-size: 12px;
      color: #7A8AAA;
      margin-top: 8px;
      opacity: 0.7;
    }
    /* Bottom block – cards, divider, input, footer */
    .bottom-block {
      margin-top: auto;
      width: 100%;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .feature-card {
      background: rgba(18,25,45,0.5);
      backdrop-filter: blur(6px);
      border-radius: 18px;
      padding: 10px 8px 8px;
      text-align: center;
      border: 0.5px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: background 0.2s;
    }
    .feature-card:hover {
      background: rgba(18,25,45,0.7);
    }
    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }
    .card-memory .card-icon { background: rgba(167,139,250,0.12); }
    .card-education .card-icon { background: rgba(96,165,250,0.12); }
    .card-income .card-icon { background: rgba(16,185,129,0.12); }
    .card-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke-width: 1.5;
    }
    .card-memory .card-icon svg { stroke: #A78BFA; }
    .card-education .card-icon svg { stroke: #60A5FA; }
    .card-income .card-icon svg { stroke: #10B981; }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: white;
    }
    .card-desc {
      font-size: 8px;
      color: #9CA3AF;
      margin-top: 2px;
      line-height: 1.2;
    }
    .divider {
      text-align: center;
      margin: 12px 0 12px;
    }
    .divider-text {
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #60A5FA;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      opacity: 0.6;
    }
    .input-capsule {
      background: #0A0F1A;
      border: 1px solid #3B82F6;
      border-radius: 50px;
      padding: 8px 14px 8px 20px;
      display: flex;
      align-items: center;

      margin-bottom: 16px;
    }
    .input-icon-left svg {

      height: 16px;

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      font-size: 14px;
      outline: none;
      padding: 8px 0;
    }
    .input-field::placeholder {
      color: #334155;
    }
    .send-circle {
      width: 34px;
      height: 34px;
      background: transparent;
      border: 1px solid #1E40AF;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .send-circle svg {
      width: 14px;
      height: 14px;
      stroke: #3B82F6;
      stroke-width: 2;
    }
    .footer-note {
      text-align: center;
      padding: 8px 0 12px;
      font-size: 10px;
      color: #4A5A7A;
      border-top: 0.5px solid rgba(255,255,255,0.04);
    }
    /* Chat overlay */
    .chat-view {
      position: fixed;
      inset: 0;
      background: rgba(3,5,10,0.85);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    .chat-view.active { display: flex; }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .back-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
    }
    .chat-actions {
      display: flex;
      gap: 12px;
    }
    .chat-action {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .chat-action.copy { color: #60A5FA; }
    .chat-action.speak { color: #A78BFA; }
    .chat-action.history { color: #F59E0B; font-size: 18px; }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }
    .message {
      max-width: 80%;
      animation: fadeUp 0.2s ease;
    }
    .message.user { align-self: flex-end; }
    .message.aria { align-self: flex-start; }
    .message-bubble {
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      color: white;
    }
    .message.user .message-bubble {
      background: rgba(96,165,250,0.2);
      border: 0.5px solid rgba(96,165,250,0.3);
    }
    .message-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      opacity: 0;
      transition: 0.2s;
    }
    .message:hover .message-actions { opacity: 0.7; }
    .message-action {
      background: transparent;
      border: none;
      font-size: 12px;
      cursor: pointer;
      color: #9CA3AF;
    }
    .message-action:hover { color: #60A5FA; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .history-modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
    }
    .history-modal.active {
      opacity: 1;
      pointer-events: auto;
    }
    .history-container {
      background: rgba(10,20,40,0.95);
      border-radius: 24px;
      max-width: 90%;
      width: 500px;
      max-height: 80%;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .history-item {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid rgba(255,255,255,0.1);
    }
    .history-user { font-size: 12px; color: #60A5FA; }
    .history-aria { font-size: 12px; color: #A78BFA; margin-top: 4px; }
    .close-history {
      background: transparent;
      border: none;
      color: white;
      font-size: 20px;
      float: right;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      .app-container { padding: 16px; }
      .greeting { font-size: 22px; }
    }
  </style>
</head>

  <script>
  // Firebase config (same as yours)
  const firebaseConfig = {
    apiKey: "AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",
    authDomain: "fiducia-148b9.firebaseapp.com",
    projectId: "fiducia-148b9",
    storageBucket: "fiducia-148b9.firebasestorage.app",
    messagingSenderId: "380888909038",
    appId: "1:380888909038:web:efe40c252537e670959fff"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  let currentUser = null;
  let lastAriaMessage = null;

  // ========== Canvas Starfield (tiny, twinkling, soft shooting star) ==========
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  let stars = [];
  let shootingStars = [];

  function initStars() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    stars = [];
    // Tiny background stars
    for (let i = 0; i < 300; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: 0.3 + Math.random() * 0.8,
        baseOpacity: 0.1 + Math.random() * 0.25,
        twinkleSpeed: 0.002 + Math.random() * 0.003,
        phase: Math.random() * Math.PI * 2
      });
    }
    // Slightly brighter stars (rare)
    for (let i = 0; i < 60; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: 0.6 + Math.random() * 0.8,
        baseOpacity: 0.3 + Math.random() * 0.4,
        twinkleSpeed: 0.001 + Math.random() * 0.002,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  let starTime = 0;
  function drawStars() {
    if (!ctx) return;
    ctx.clearRect(0, 0, width, height);
    starTime += 0.016;
    for (let s of stars) {
      const twinkle = 0.6 + 0.4 * Math.sin(starTime * s.twinkleSpeed + s.phase);
      const opacity = s.baseOpacity * twinkle;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255, 245, 235, ${opacity})`;
      ctx.fill();
    }
    // Draw shooting stars (soft, multi‑layer)
    for (let i = 0; i < shootingStars.length; i++) {
      const ss = shootingStars[i];
      ss.progress += ss.speed;
      if (ss.progress >= 1) {
        shootingStars.splice(i,1);
        i--;
        continue;
      }
      const x = ss.startX + (ss.endX - ss.startX) * ss.progress;
      const y = ss.startY + (ss.endY - ss.startY) * ss.progress;
      const tailX = x - Math.cos(ss.angle) * 40;
      const tailY = y - Math.sin(ss.angle) * 40;
      const fade = 1 - ss.progress;
      // Outer glow
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = `rgba(255,255,240, ${fade * 0.08})`;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.stroke();
      // Middle
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = `rgba(255,255,240, ${fade * 0.25})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      // Core
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = `rgba(255,255,255, ${fade * 0.8})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
    requestAnimationFrame(drawStars);
  }

  function addShootingStar() {
    if (shootingStars.length > 1) return;
    const startX = width * (0.6 + Math.random() * 0.3);
    const startY = height * (0.1 + Math.random() * 0.2);
    const endX = startX - width * 0.35;
    const endY = startY + height * 0.25;
    const angle = Math.atan2(endY - startY, endX - startX);
    shootingStars.push({ startX, startY, endX, endY, progress: 0, speed: 0.003 + Math.random() * 0.002, angle });
  }

  window.addEventListener('resize', () => { initStars(); });
  initStars();
  drawStars();
  setInterval(() => { if (Math.random() > 0.7) addShootingStar(); }, 25000);
  addShootingStar();

  // ========== UI Logic ==========
  function updateTimestamp() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-NG', { hour:'2-digit', minute:'2-digit', timeZone:'Africa/Lagos' });
    const el = document.getElementById('timestamp');
    if (el) el.textContent = timeStr;
  }
  updateTimestamp();
  setInterval(updateTimestamp, 60000);

  const mainUI = document.getElementById('mainUI');
  const chatView = document.getElementById('chatView');
  const mainInput = document.getElementById('mainInput');
  const chatInput = document.getElementById('chatInput');
  const messagesArea = document.getElementById('messagesArea');
  const userNameSpan = document.getElementById('userNameDisplay');
  const userInitialsSpan = document.getElementById('userInitials');
  const historyModal = document.getElementById('historyModal');
  const historyContent = document.getElementById('historyContent');

  function abbreviateName(fullName) {
    if (!fullName) return 'EN';
    const parts = fullName.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
    return (parts[0][0] + (parts[1][0] || '')).toUpperCase();
  }

  async function loadHistory(ariaUid) {
    try {
      const res = await fetch(`/context?uid=${ariaUid}`);
      const data = await res.json();
      if (data.context) {
        const lines = data.context.split('\n');
        let current = null;
        for (let line of lines) {
          if (line.startsWith('User:')) {
            if (current) addMessage(current.trim(), 'aria');
            current = null;
            addMessage(line.substring(5).trim(), 'user');
          } else if (line.startsWith('ARIA:')) {
            current = line.substring(5).trim();
          }
        }
        if (current) addMessage(current.trim(), 'aria');
      }
    } catch(e) { console.warn('History load failed', e); }
  }

  async function fetchHistoryForModal() {
    if (!currentUser) return;
    try {
      const uidRes = await fetch('/check_user?email=' + encodeURIComponent(currentUser.email.toLowerCase()));
      const uidData = await uidRes.json();
      if (!uidData.aria_uid) return;
      const res = await fetch(`/context?uid=${uidData.aria_uid}`);
      const data = await res.json();
      if (data.context) {
        const lines = data.context.split('\n');
        let items = [];
        let uMsg = null, aMsg = null;
        for (let line of lines) {
          if (line.startsWith('User:')) {
            if (uMsg && aMsg) items.push({ user: uMsg, aria: aMsg });
            uMsg = line.substring(5).trim();
            aMsg = null;
          } else if (line.startsWith('ARIA:')) {
            aMsg = line.substring(5).trim();
          }
        }
        if (uMsg && aMsg) items.push({ user: uMsg, aria: aMsg });
        historyContent.innerHTML = '';
        items.slice(-10).forEach(item => {
          const div = document.createElement('div');
          div.className = 'history-item';
          div.innerHTML = `<div class="history-user">🧑 ${item.user}</div><div class="history-aria">🤖 ${item.aria}</div>`;
          historyContent.appendChild(div);
        });
        if (items.length === 0) historyContent.innerHTML = '<p>No conversation history yet.</p>';
      } else {
        historyContent.innerHTML = '<p>No conversation history yet.</p>';
      }
    } catch(e) { historyContent.innerHTML = '<p>Failed to load history.</p>'; }
  }

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `message ${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble';
    bubble.innerHTML = marked.parse(text);
    const actions = document.createElement('div');
    actions.className = 'message-actions';
    if (sender === 'aria') {
      actions.innerHTML = `<button class="message-action copy-msg">📋 Copy</button><button class="message-action speak-msg">🔊 Speak</button>`;
      actions.querySelector('.copy-msg').onclick = () => navigator.clipboard.writeText(text);
      actions.querySelector('.speak-msg').onclick = () => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        speechSynthesis.cancel();
        speechSynthesis.speak(utterance);
      };
    }
    div.appendChild(bubble);
    if (sender === 'aria') div.appendChild(actions);
    messagesArea.appendChild(div);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    if (sender === 'aria') lastAriaMessage = text;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'message aria';
    div.id = 'typingIndicator';
    div.innerHTML = `<div class="message-bubble">✦ ✦ ✦</div>`;
    messagesArea.appendChild(div);
    messagesArea.scrollTop = messagesArea.scrollHeight;
  }
  function removeTyping() {
    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  async function sendToAria(message, inputElement) {
    if (!currentUser) return;
    addMessage(message, 'user');
    inputElement.value = '';
    addTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, user_id: currentUser.uid, email: currentUser.email.toLowerCase() })
      });
      const data = await res.json();
      removeTyping();
      if (data.error) addMessage(`Error: ${data.error}`, 'aria');
      else addMessage(data.reply || '...', 'aria');
    } catch(e) { removeTyping(); addMessage('Connection uncertain. Please try again.', 'aria'); }
  }

  function openChat() {
    mainUI.style.display = 'none';
    chatView.classList.add('active');
    if (messagesArea.children.length === 0 && currentUser) {
      addMessage(`Hey ${abbreviateName(currentUser.displayName || currentUser.email.split('@')[0])}. I'm ARIA. What would you like to explore?`, 'aria');
    }
    chatInput.focus();
  }
  function closeChat() {
    mainUI.style.display = 'flex';
    chatView.classList.remove('active');
    messagesArea.innerHTML = '';
  }
  async function signOut() {
    try { await auth.signOut(); window.location.href = '/login.html'; } catch(e) { console.error(e); } }
  function showHistory() { fetchHistoryForModal(); historyModal.classList.add('active'); }
  function closeHistory() { historyModal.classList.remove('active'); }

  mainInput.addEventListener('focus', openChat);
  document.querySelectorAll('.feature-card').forEach(card => {
    card.addEventListener('click', () => {
      openChat();
      addMessage(`Let's talk about ${card.querySelector('.card-title').textContent}. How can I help?`, 'aria');
    });
  });
  document.getElementById('closeChatBtn').addEventListener('click', closeChat);
  document.getElementById('chatSendBtn').addEventListener('click', () => { const msg = chatInput.value.trim(); if (msg) sendToAria(msg, chatInput); });
  chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); const msg = chatInput.value.trim(); if (msg) sendToAria(msg, chatInput); } });
  document.getElementById('sendBtn').addEventListener('click', () => { const msg = mainInput.value.trim(); if (msg) sendToAria(msg, mainInput); });
  mainInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); const msg = mainInput.value.trim(); if (msg) sendToAria(msg, mainInput); } });
  document.getElementById('copyLastMsgBtn').addEventListener('click', () => { if (lastAriaMessage) navigator.clipboard.writeText(lastAriaMessage); });
  document.getElementById('speakLastMsgBtn').addEventListener('click', () => { if (lastAriaMessage) { const u = new SpeechSynthesisUtterance(lastAriaMessage); u.lang = 'en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); } });
  document.getElementById('historyBtn').addEventListener('click', showHistory);
  document.getElementById('closeHistoryBtn').addEventListener('click', closeHistory);
  historyModal.addEventListener('click', (e) => { if (e.target === historyModal) closeHistory(); });
  document.getElementById('signoutBtn').addEventListener('click', signOut);

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      const displayName = user.displayName || user.email.split('@')[0];
      const shortName = abbreviateName(displayName);
      userNameSpan.textContent = displayName;
      userInitialsSpan.textContent = shortName;
      try {
        await fetch('/set_user_name', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: user.uid, email: user.email.toLowerCase(), name: displayName })
        });
        const uidRes = await fetch('/check_user?email=' + encodeURIComponent(user.email.toLowerCase()));
        const uidData = await uidRes.json();
        if (uidData.aria_uid) loadHistory(uidData.aria_uid);
      } catch(e) { console.warn(e); }
    } else {
      window.location.href = '/login.html';
    }
  });
</script>
</body>
</html>
