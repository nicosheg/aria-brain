ia_uid",user.uid);localStorage.setItem("aria_email",user.email);localStorage.setItem("aria_name",user.displayName||user.email.split("@")[0]);window.location.href="/index.html"}});document.getElementById("loginBtn").onclick=()=>{const provider=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(provider).then(result=>{localStorage.setItem("aria_uid",result.user.uid);localStorage.setItem("aria_email",result.user.email);localStorage.setItem("aria_name",result.user.displayName||result.user.email.split("@")[0]);window.location.href="/index.html"}).catch(error=>{document.getElementById("error").innerHTML="Login failed: "+error.message})};</script></body></html>
