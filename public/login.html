<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ARIA Login</title><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script><style>body{margin:0;padding:0;background:linear-gradient(160deg,#070a1e 0%,#0b0f28 50%,#0f0820 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}.login-box{text-align:center;padding:40px;background:rgba(13,17,40,.8);border:1.5px solid #00d9ff;border-radius:20px;box-shadow:0 0 30px rgba(0,217,255,.2);max-width:400px}h1{font-size:36px;margin-bottom:10px}h1 span{color:#00d9ff}.subtitle{color:rgba(255,255,255,.6);margin-bottom:30px;font-size:14px}.login-btn{padding:12px 24px;background:linear-gradient(135deg,#00c4e8 0%,#0099bb 100%);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;width:100%;margin-bottom:20px}.login-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,217,255,.3);background:linear-gradient(135deg,#00e6ff 0%,#00aadd 100%)}.login-btn:active{transform:scale(0.98)}.error{color:#ff6b6b;margin-top:10px;font-size:13px;background:rgba(255,107,107,.1);padding:10px;border-radius:8px}.debug{color:rgba(255,255,255,.5);font-size:11px;margin-top:20px;text-align:left}</style></head><body><div class="login-box"><h1>🇳🇬 <span>ARIA</span></h1><div class="subtitle">Sign in to continue</div><button class="login-btn" id="loginBtn" onclick="handleLogin()">Sign in with Google</button><div id="status"></div><div class="debug" id="debug"></div></div><script>let debugLog=[];function log(msg){debugLog.push(msg);console.log(msg);document.getElementById("debug").innerHTML="<p>"+debugLog.join("<br>")+"</p>"}log("Page loaded, waiting for Firebase...");const firebaseConfig={apiKey:"AIzaSyAfrs67qWlU8FjsjqHwNeivGgm7x_vHdJY",authDomain:"fiducia-148b9.firebaseapp.com",projectId:"fiducia-148b9",storageBucket:"fiducia-148b9.firebasestorage.app",messagingSenderId:"380888909038",appId:"1:380888909038:web:efe40c252537e670959fff"};let firebaseReady=false;let checkAttempts=0;function waitForFirebase(){if(typeof firebase!=="undefined"&&firebase.initializeApp){log("Firebase found ✓");try{firebase.initializeApp(firebaseConfig);log("Firebase initialized ✓");firebaseReady=true;setupAuth()}catch(e){log("Init error: "+e.message)}return}checkAttempts++;if(checkAttempts<50){log("Waiting for Firebase... ("+checkAttempts+"/50)");setTimeout(waitForFirebase,100)}else{log("ERROR: Firebase SDK failed to load!")}}function setupAuth(){firebase.auth().onAuthStateChanged(user=>{if(user){log("Already logged in as: "+user.email);localStorage.setItem("aria_uid",user.uid);localStorage.setItem("aria_email",user.email);localStorage.setItem("aria_name",user.displayName||user.email.split("@")[0]);setTimeout(()=>{window.location.href="/index.html"},500)}})}function handleLogin(){if(!firebaseReady){log("Firebase not ready yet!");return}log("Button clicked!");const provider=new firebase.auth.GoogleAuthProvider();firebase.auth().signInWithPopup(provider).then(result=>{log("Sign in success!");localStorage.setItem("aria_uid",result.user.uid);localStorage.setItem("aria_email",result.user.email);localStorage.setItem("aria_name",result.user.displayName||result.user.email.split("@")[0]);window.location.href="/index.html"}).catch(error=>{log("Sign in failed: "+error.message);document.getElementById("status").innerHTML='<div class="error">Error: '+error.message+'</div>'})}waitForFirebase();</script></body></html>
